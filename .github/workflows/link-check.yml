name: Link Check

on:
    push:
        paths:
            - "**.md"
            - ".lycheeignore"
            - ".github/lychee.toml"
    pull_request:
        paths:
            - "**.md"
    schedule:
        # Run weekly on Sundays at 3:00 AM UTC
        - cron: "0 3 * * 0"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check-links:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            # Pull requests check internal links and anchors only (--offline): deterministic and
            # seconds long. Third-party availability failed three PRs in one day with zero real
            # broken links (#1097); the external scan runs on push to main, weekly and on dispatch.
            - name: Check markdown links (internal only, pull requests)
              if: github.event_name == 'pull_request'
              uses: lycheeverse/lychee-action@v2
              with:
                  args: >-
                      --verbose
                      --no-progress
                      --offline
                      --config '.github/lychee.toml'
                      'docs/**/*.md'
                      '.github/**/*.md'
                      'README.md'
                      'CHANGELOG.md'
                      'changelog.d/**/*.md'
                      'CONTRIBUTING.md'
                      'ROADMAP.md'
                  fail: true

            - name: Check markdown links (full scan)
              if: github.event_name != 'pull_request'
              uses: lycheeverse/lychee-action@v2
              with:
                  args: >-
                      --verbose
                      --no-progress
                      --config '.github/lychee.toml'
                      'docs/**/*.md'
                      '.github/**/*.md'
                      'README.md'
                      'CHANGELOG.md'
                      'changelog.d/**/*.md'
                      'CONTRIBUTING.md'
                      'ROADMAP.md'
                  fail: true
