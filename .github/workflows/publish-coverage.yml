name: Publish Coverage Data

# Triggered when CI Full completes on main. The publish-data job downloads the
# coverage artifact, computes the dashboard data (latest.json, history.json,
# docref-index.json, badges) and commits it to the dashboard-data branch
# (.github/scripts/pages-dashboard-data.ps1, #1386). The deploy job then calls
# docs.yml, the only Pages deployer (#1381), which renders the covref citations
# and, inside the "pages" lock, lays the data of every dashboard over the site
# and deploys it.
#
# A source run that did not succeed fails this workflow visibly instead of
# skipping it (#1361).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'CI Full run ID to use (leave empty for latest successful)'
        required: false
  workflow_run:
    workflows: ["CI Full"]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-coverage
  cancel-in-progress: false

jobs:
  publish-data:
    name: Compute coverage dashboard data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write is for the dashboard-data branch push only.
    permissions:
      contents: write
      actions: read

    steps:
      - name: Require a successful source run
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        env:
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "::error title=Source run did not succeed::$SOURCE_WORKFLOW run $SOURCE_RUN_ID concluded $SOURCE_CONCLUSION; nothing was published"
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve CI Full run ID
        id: resolve
        run: |
          RID="${INPUT_RUN_ID:-$EVENT_RUN_ID}"
          if [ -z "$RID" ]; then
            RID=$(gh run list --workflow "CI Full" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "Auto-resolved latest successful CI Full: $RID"
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}

      - name: Download coverage artifact from CI
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage-artifact
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the base data from the dashboard-data branch
        # The base of history.json is the branch, not the live site: live lags
        # while a deploy is pending, cancelled or failed. Nothing is written when
        # the branch or the domain is absent.
        shell: pwsh
        run: ./.github/scripts/pages-dashboard-data.ps1 -Mode Read -Domain coverage -OutDir base/coverage

      - name: Read the live base data from Pages
        # Second choice of base after the branch. A 404 writes nothing; any other
        # failure (HTTP error, timeout, invalid JSON) fails the job instead of
        # being taken for an empty history. Skipped when the branch already
        # carries history.json.
        if: hashFiles('base/coverage/history.json') == ''
        shell: pwsh
        run: ./.github/scripts/pages-dashboard-data.ps1 -Mode Live -Domain coverage -OutDir live/coverage

      - name: Stage fresh coverage data in the Pages overlay
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          # Only the files this workflow owns go into overlay/coverage/; they are
          # persisted to the dashboard-data branch, which docs.yml deploys.
          mkdir -p overlay/coverage/data

          if [ ! -s coverage-artifact/encina-coverage-summary.json ]; then
            echo "::error title=Coverage summary missing::coverage-report artifact of run $RUN_ID has no encina-coverage-summary.json; nothing was published"
            exit 1
          fi
          cp -f coverage-artifact/encina-coverage-summary.json overlay/coverage/data/latest.json
          cp -f coverage-artifact/badge.svg overlay/coverage/badge.svg 2>/dev/null || true
          cp -f coverage-artifact/badge.json overlay/coverage/badge.json 2>/dev/null || true

          # Coverage DocRef index (SPEC-001). Guard: an empty candidate never replaces the
          # published index; when it is left out of the overlay, the dashboard-data branch
          # (or, before the first persist, the live Pages copy) keeps the previous one.
          # IDs come from the manifests (REQ-003), so the index is never literally
          # empty: a run whose Cobertura collection broke still lists every file,
          # all noData. "Empty" therefore means "no entry with data".
          if [ -s coverage-artifact/docref-index.json ] && [ "$(jq '[.[] | select(.noData | not)] | length' coverage-artifact/docref-index.json)" -gt 0 ]; then
            cp -f coverage-artifact/docref-index.json overlay/coverage/data/docref-index.json
            echo "Coverage DocRef index: $(jq 'length' overlay/coverage/data/docref-index.json) entries from the CI artifact"
          else
            echo "No usable DocRef index in the artifact; the live Pages copy is kept"
          fi

          # Inject runId into the snapshot so history can reference raw artifacts
          jq --argjson rid "$RUN_ID" '. + {runId: $rid}' \
            overlay/coverage/data/latest.json > _tmp.json && mv _tmp.json overlay/coverage/data/latest.json

          # Archive snapshot
          STAMP=$(date -u +"%Y-%m-%dT%H%M%SZ")
          cp -f overlay/coverage/data/latest.json "overlay/coverage/data/${STAMP}.json"

          # History strategy, in order: the dashboard-data branch copy when it
          # exists and is non-empty (the durable record, read by the Read step);
          # otherwise the larger, by entry count, of the live Pages copy (read by
          # the Live step; a 404 means it does not exist yet, any other failure
          # already failed the job) and the copy tracked in main (it lags because
          # nothing commits it back).
          if [ -s base/coverage/history.json ]; then
            cp -f base/coverage/history.json overlay/coverage/data/history.json
            echo "Using the dashboard-data branch history ($(grep -c timestamp overlay/coverage/data/history.json || true) entries)"
          else
            cp -f docs/coverage/data/history.json overlay/coverage/data/history.json 2>/dev/null || echo "[]" > overlay/coverage/data/history.json
            REPO_ENTRIES=$(grep -c timestamp overlay/coverage/data/history.json 2>/dev/null) || REPO_ENTRIES=0
            if [ -s live/coverage/history.json ] && head -c 1 live/coverage/history.json | grep -q '^\['; then
              PAGES_ENTRIES=$(grep -c timestamp live/coverage/history.json) || PAGES_ENTRIES=0
              if [ "$PAGES_ENTRIES" -ge "$REPO_ENTRIES" ]; then
                echo "Using Pages history ($PAGES_ENTRIES entries, repo has $REPO_ENTRIES)"
                cp -f live/coverage/history.json overlay/coverage/data/history.json
              else
                echo "Using repo history ($REPO_ENTRIES entries, Pages has $PAGES_ENTRIES)"
              fi
            else
              echo "Using repo history ($REPO_ENTRIES entries, no live history.json)"
            fi
          fi

          # Update history (appends current snapshot)
          dotnet run .github/scripts/coverage-history.cs -- \
            --latest overlay/coverage/data/latest.json \
            --history overlay/coverage/data/history.json

          echo "Overlay contents:"
          find overlay -type f | sort

      - name: Persist the overlay to the dashboard-data branch
        # Committed before the deploy is requested, so a deploy that the
        # "pages" group cancels, or that fails, loses no dashboard data: the
        # next deploy of any kind reads the branch inside the lock (#1386).
        shell: pwsh
        run: ./.github/scripts/pages-dashboard-data.ps1 -Mode Persist -Domain coverage -OverlayRoot overlay

  deploy:
    name: Deploy site with fresh coverage data
    needs: publish-data
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
