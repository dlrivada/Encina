name: feature-plan-check
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  feature-plans:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Check FEATURE issues have a plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pwsh -NoProfile -File tools/ai/issues/check-feature-plans.ps1
