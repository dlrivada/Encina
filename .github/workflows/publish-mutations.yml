name: Publish Mutations Data

# Triggered when Mutation Tests completes on main. The publish-data job
# downloads the Stryker report, computes the dashboard data (latest.json,
# history.json, docref-index.json) and uploads it as the artifact
# pages-overlay-mutations. The deploy job then calls docs.yml, the only Pages
# deployer (#1381), which lays that overlay over the live data of every
# dashboard, renders the mutref citations and deploys the whole site.
#
# A source run that did not succeed fails this workflow visibly instead of
# skipping it (#1361).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Mutation Tests run ID (leave empty for latest successful)'
        required: false
  workflow_run:
    workflows: ["Mutation Tests"]
    types: [completed]
    branches: [main]

# Not "pages": docs.yml holds that group on its deploy job, and a caller in the
# same group would wait on itself.
concurrency:
  group: publish-mutations
  cancel-in-progress: false

jobs:
  publish-data:
    name: Compute mutation dashboard data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Require a successful source run
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        env:
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "::error title=Source run did not succeed::$SOURCE_WORKFLOW run $SOURCE_RUN_ID concluded $SOURCE_CONCLUSION; nothing was published"
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve Mutation Tests run ID
        id: resolve
        run: |
          RID="${{ inputs.run_id || github.event.workflow_run.id }}"
          if [ -z "$RID" ]; then
            RID=$(gh run list --workflow "Mutation Tests" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "Auto-resolved latest successful Mutation Tests: $RID"
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download mutation report artifact
        uses: actions/download-artifact@v8
        with:
          name: mutation-report
          path: mutation-artifact
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage fresh mutation data in the Pages overlay
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          # Only the files this workflow owns go into overlay/mutations/; docs.yml
          # copies them over the live Pages data of every dashboard.
          mkdir -p overlay/mutations/data mutation-work

          # Find the mutation report JSON
          REPORT=""
          if [ -f "mutation-artifact/mutation-report.json" ]; then
            REPORT="mutation-artifact/mutation-report.json"
          else
            REPORT=$(find mutation-artifact -name "mutation-report.json" -type f 2>/dev/null | head -1)
          fi

          if [ -z "$REPORT" ]; then
            echo "::error title=Mutation report missing::mutation-report artifact of run $RUN_ID has no mutation-report.json; nothing was published"
            ls -R mutation-artifact/ || true
            exit 1
          fi

          # Read Stryker scope from config
          SCOPE=$(grep -oP '"mutate"\s*:\s*\[\s*"([^"]+)"' .github/stryker-config.json | head -1 | sed 's/.*"\([^"]*\)"/\1/' || echo "")
          echo "Stryker scope: $SCOPE"

          # History strategy: fetch from live Pages (authoritative), fall back to the
          # copy tracked in main, which lags because nothing commits it back.
          cp -f docs/mutations/data/history.json overlay/mutations/data/history.json 2>/dev/null || echo "[]" > overlay/mutations/data/history.json
          PAGES_URL="https://dlrivada.github.io/Encina/mutations/data/history.json"
          PAGES_HISTORY=$(curl -fsSL "$PAGES_URL" 2>/dev/null || echo "")
          REPO_ENTRIES=$(grep -c timestamp overlay/mutations/data/history.json 2>/dev/null) || REPO_ENTRIES=0

          if [ -n "$PAGES_HISTORY" ] && echo "$PAGES_HISTORY" | head -1 | grep -q '^\['; then
            PAGES_ENTRIES=$(echo "$PAGES_HISTORY" | grep -c timestamp) || PAGES_ENTRIES=0
            if [ "$PAGES_ENTRIES" -ge "$REPO_ENTRIES" ]; then
              echo "Using Pages history ($PAGES_ENTRIES entries, repo has $REPO_ENTRIES)"
              echo "$PAGES_HISTORY" > overlay/mutations/data/history.json
            else
              echo "Using repo history ($REPO_ENTRIES entries, Pages has $PAGES_ENTRIES)"
            fi
          else
            echo "Using repo history ($REPO_ENTRIES entries, Pages not available)"
          fi

          # Fetch previous latest.json from live Pages for merge.
          # Each weekly run mutates a different folder; merging carries forward
          # data from files not touched by this run so the dashboard accumulates.
          MERGE_ARG=""
          PAGES_LATEST_URL="https://dlrivada.github.io/Encina/mutations/data/latest.json"
          if curl -fsSL -o mutation-work/previous-latest.json "$PAGES_LATEST_URL" 2>/dev/null; then
            MERGE_ARG="--merge-from mutation-work/previous-latest.json"
            echo "Will merge with previous latest.json from Pages"
          else
            echo "No previous latest.json on Pages — first run"
          fi

          dotnet run .github/scripts/mutation-history.cs -- \
            --report "$REPORT" \
            --latest mutation-work/latest-candidate.json \
            --history overlay/mutations/data/history.json \
            --docref-index mutation-work/docref-index-candidate.json \
            --src-root src/Encina \
            --run-id "$RUN_ID" \
            --scope "$SCOPE" \
            $MERGE_ARG

          # Guard: do not overwrite the dashboard with an empty report.
          # When --since filters out all mutants, total=0 — leave latest.json and
          # docref-index.json out of the overlay so docs.yml keeps the live copies,
          # which hold the last real run's data.
          TOTAL=$(grep -o '"total": *[0-9]*' mutation-work/latest-candidate.json | head -1 | grep -o '[0-9]*' || echo "0")
          if [ "$TOTAL" -gt 0 ]; then
            echo "Mutation data has $TOTAL mutants — updating latest.json + docref-index.json"
            mv mutation-work/latest-candidate.json overlay/mutations/data/latest.json
            mv mutation-work/docref-index-candidate.json overlay/mutations/data/docref-index.json
            STAMP=$(date -u +"%Y-%m-%dT%H%M%SZ")
            cp -f overlay/mutations/data/latest.json "overlay/mutations/data/${STAMP}.json"
          else
            echo "::warning title=No eligible mutants::Run $RUN_ID produced no eligible mutants (--since filtered everything); the live latest.json is kept"
          fi

          echo "Overlay contents:"
          find overlay -type f | sort

      - name: Upload Pages overlay
        uses: actions/upload-artifact@v7
        with:
          name: pages-overlay-mutations
          path: overlay/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy site with fresh mutation data
    needs: publish-data
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      overlay-artifact: pages-overlay-mutations
