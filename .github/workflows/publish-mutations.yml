name: Publish Mutations Data

# Triggered when Mutation Tests completes on main. The publish-data job
# downloads the Stryker report, computes the dashboard data (latest.json,
# history.json, docref-index.json) and commits it to the dashboard-data branch
# (.github/scripts/pages-dashboard-data.ps1, #1386). The deploy job then calls
# docs.yml, the only Pages deployer (#1381), which renders the mutref citations
# and, inside the "pages" lock, lays the data of every dashboard over the site
# and deploys it.
#
# A source run that did not succeed fails this workflow visibly instead of
# skipping it (#1361).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Mutation Tests run ID (leave empty for latest successful)'
        required: false
  workflow_run:
    workflows: ["Mutation Tests"]
    types: [completed]
    branches: [main]

# Not "pages": docs.yml holds that group on its deploy job, and a caller in the
# same group would wait on itself.
concurrency:
  group: publish-mutations
  cancel-in-progress: false

jobs:
  publish-data:
    name: Compute mutation dashboard data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write is for the dashboard-data branch push only.
    permissions:
      contents: write
      actions: read

    steps:
      - name: Require a successful source run
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        env:
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "::error title=Source run did not succeed::$SOURCE_WORKFLOW run $SOURCE_RUN_ID concluded $SOURCE_CONCLUSION; nothing was published"
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve Mutation Tests run ID
        id: resolve
        run: |
          RID="${INPUT_RUN_ID:-$EVENT_RUN_ID}"
          if [ -z "$RID" ]; then
            RID=$(gh run list --workflow "Mutation Tests" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "Auto-resolved latest successful Mutation Tests: $RID"
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}

      - name: Download mutation report artifact
        uses: actions/download-artifact@v8
        with:
          name: mutation-report
          path: mutation-artifact
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the base data from the dashboard-data branch
        # The base of history.json and of the merged latest.json is the branch,
        # not the live site: live lags while a deploy is pending, cancelled or
        # failed. Nothing is written when the branch or the domain is absent.
        shell: pwsh
        run: ./.github/scripts/pages-dashboard-data.ps1 -Mode Read -Domain mutations -OutDir base/mutations

      - name: Read the live base data from Pages
        # Second choice of base after the branch. A 404 writes nothing (first
        # run); any other failure (HTTP error, timeout, invalid JSON) fails the
        # job instead of being taken for a first run. Skipped when the branch
        # already carries both base files.
        if: hashFiles('base/mutations/latest.json') == '' || hashFiles('base/mutations/history.json') == ''
        shell: pwsh
        run: ./.github/scripts/pages-dashboard-data.ps1 -Mode Live -Domain mutations -OutDir live/mutations

      - name: Stage fresh mutation data in the Pages overlay
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          # Only the files this workflow owns go into overlay/mutations/; they are
          # persisted to the dashboard-data branch, which docs.yml deploys.
          mkdir -p overlay/mutations/data mutation-work

          # Find the mutation report JSON
          REPORT=""
          if [ -f "mutation-artifact/mutation-report.json" ]; then
            REPORT="mutation-artifact/mutation-report.json"
          else
            REPORT=$(find mutation-artifact -name "mutation-report.json" -type f 2>/dev/null | head -1)
          fi

          if [ -z "$REPORT" ]; then
            echo "::error title=Mutation report missing::mutation-report artifact of run $RUN_ID has no mutation-report.json; nothing was published"
            ls -R mutation-artifact/ || true
            exit 1
          fi

          # Read Stryker scope from config
          SCOPE=$(grep -oP '"mutate"\s*:\s*\[\s*"([^"]+)"' .github/stryker-config.json | head -1 | sed 's/.*"\([^"]*\)"/\1/' || echo "")
          echo "Stryker scope: $SCOPE"

          # History strategy, in order: the dashboard-data branch copy when it
          # exists and is non-empty (the durable record, read by the Read step);
          # otherwise the larger, by entry count, of the live Pages copy (read by
          # the Live step; a 404 means it does not exist yet, any other failure
          # already failed the job) and the copy tracked in main (it lags because
          # nothing commits it back).
          if [ -s base/mutations/history.json ]; then
            cp -f base/mutations/history.json overlay/mutations/data/history.json
            echo "Using the dashboard-data branch history ($(grep -c timestamp overlay/mutations/data/history.json || true) entries)"
          else
            cp -f docs/mutations/data/history.json overlay/mutations/data/history.json 2>/dev/null || echo "[]" > overlay/mutations/data/history.json
            REPO_ENTRIES=$(grep -c timestamp overlay/mutations/data/history.json 2>/dev/null) || REPO_ENTRIES=0
            if [ -s live/mutations/history.json ] && head -c 1 live/mutations/history.json | grep -q '^\['; then
              PAGES_ENTRIES=$(grep -c timestamp live/mutations/history.json) || PAGES_ENTRIES=0
              if [ "$PAGES_ENTRIES" -ge "$REPO_ENTRIES" ]; then
                echo "Using Pages history ($PAGES_ENTRIES entries, repo has $REPO_ENTRIES)"
                cp -f live/mutations/history.json overlay/mutations/data/history.json
              else
                echo "Using repo history ($REPO_ENTRIES entries, Pages has $PAGES_ENTRIES)"
              fi
            else
              echo "Using repo history ($REPO_ENTRIES entries, no live history.json)"
            fi
          fi

          # Previous latest.json for the merge, in order: the dashboard-data
          # branch copy, the live Pages copy. The committed copy in docs/ is NOT
          # used: it holds old shard results and would merge them back in. When
          # neither exists (branch empty and live 404) this is the first run; a
          # live read failure other than 404 already failed the Live step.
          # Each weekly run mutates a different folder; merging carries forward
          # data from files not touched by this run so the dashboard accumulates.
          MERGE_ARG=""
          if [ -s base/mutations/latest.json ]; then
            cp -f base/mutations/latest.json mutation-work/previous-latest.json
            MERGE_ARG="--merge-from mutation-work/previous-latest.json"
            echo "Will merge with previous latest.json from the dashboard-data branch"
          elif [ -s live/mutations/latest.json ]; then
            cp -f live/mutations/latest.json mutation-work/previous-latest.json
            MERGE_ARG="--merge-from mutation-work/previous-latest.json"
            echo "Will merge with previous latest.json from Pages"
          else
            echo "No previous latest.json on the branch, and Pages returned 404 — first run"
          fi

          dotnet run .github/scripts/mutation-history.cs -- \
            --report "$REPORT" \
            --latest mutation-work/latest-candidate.json \
            --history overlay/mutations/data/history.json \
            --docref-index mutation-work/docref-index-candidate.json \
            --src-root src/Encina \
            --run-id "$RUN_ID" \
            --scope "$SCOPE" \
            $MERGE_ARG

          # Guard: do not overwrite the dashboard with an empty report.
          # When --since filters out all mutants, total=0 — leave latest.json and
          # docref-index.json out of the overlay so the dashboard-data branch keeps
          # the copies of the last real run.
          TOTAL=$(grep -o '"total": *[0-9]*' mutation-work/latest-candidate.json | head -1 | grep -o '[0-9]*' || echo "0")
          if [ "$TOTAL" -gt 0 ]; then
            echo "Mutation data has $TOTAL mutants — updating latest.json + docref-index.json"
            mv mutation-work/latest-candidate.json overlay/mutations/data/latest.json
            mv mutation-work/docref-index-candidate.json overlay/mutations/data/docref-index.json
            STAMP=$(date -u +"%Y-%m-%dT%H%M%SZ")
            cp -f overlay/mutations/data/latest.json "overlay/mutations/data/${STAMP}.json"
          else
            echo "::warning title=No eligible mutants::Run $RUN_ID produced no eligible mutants (--since filtered everything); the previously published latest.json is kept"
          fi

          echo "Overlay contents:"
          find overlay -type f | sort

      - name: Persist the overlay to the dashboard-data branch
        # Committed before the deploy is requested, so a deploy that the
        # "pages" group cancels, or that fails, loses no dashboard data: the
        # next deploy of any kind reads the branch inside the lock (#1386).
        shell: pwsh
        run: ./.github/scripts/pages-dashboard-data.ps1 -Mode Persist -Domain mutations -OverlayRoot overlay

  deploy:
    name: Deploy site with fresh mutation data
    needs: publish-data
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
