name: CodeQL

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 3 * * 1"
    workflow_dispatch:

concurrency:
    group: codeql-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    # Light path (#3843): a pull request whose every changed file is under docs/plans/** has
    # no code to analyse, so Analyze is skipped (a skipped required check counts as passed).
    # Fail closed: the detection runs on pull_request events only; push, schedule and manual
    # runs always analyse, and so does a pull request when this job fails or says anything
    # other than 'false' (Analyze runs unless the answer is exactly 'false').
    changes:
        name: Detect plans-only change
        runs-on: ubuntu-latest
        timeout-minutes: 2
        permissions:
            contents: read
            pull-requests: read
        outputs:
            other-files: ${{ steps.filter.outputs.other }}
        steps:
            - uses: dorny/paths-filter@v4
              id: filter
              if: github.event_name == 'pull_request'
              with:
                  # 'every': a file counts only when it matches all patterns, so 'other' is true
                  # exactly when some changed file is outside docs/plans/**.
                  predicate-quantifier: every
                  filters: |
                      other:
                        - '**'
                        - '!docs/plans/**'

    analyze:
        name: Analyze
        needs: changes
        if: ${{ !cancelled() && needs.changes.outputs.other-files != 'false' }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            security-events: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # build-mode none: CodeQL extracts C# from source without compiling the 105-project
            # solution. The compiled analysis took ~36 min per pull request and was the critical
            # path of every auto-merge (#1097); source-mode analysis needs no SDK or restore.
            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: csharp
                  build-mode: none

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
