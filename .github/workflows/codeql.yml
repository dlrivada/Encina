name: CodeQL

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 3 * * 1"
    workflow_dispatch:

permissions:
    contents: read
    security-events: write

concurrency:
    group: codeql-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    analyze:
        name: Analyze
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            # build-mode none: CodeQL extracts C# from source without compiling the 105-project
            # solution. The compiled analysis took ~36 min per pull request and was the critical
            # path of every auto-merge (#1097); source-mode analysis needs no SDK or restore.
            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: csharp
                  build-mode: none

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
