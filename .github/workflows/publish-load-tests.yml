name: Publish Load Tests Data

# Triggered when the Load Tests workflow completes on main. The publish-data job
# downloads all load-test artifacts (console harness + NBomber scenarios), runs
# perf-report.cs --kind load-tests to produce a unified snapshot, archives raw
# data to perf-raw, computes the dashboard data (latest.json, history.json,
# docref-index.json) and commits it to the dashboard-data branch
# (.github/scripts/pages-dashboard-data.ps1, #1386). The deploy job then calls
# docs.yml, the only Pages deployer (#1381), which, inside the "pages" lock,
# lays the data of every dashboard over the site and deploys it.
#
# A source run that did not succeed fails this workflow visibly instead of
# skipping it (#1361).
#
# Mirrors publish-benchmarks.yml; see ADR-025 for the architectural pattern.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Load Tests run ID to use (leave empty for latest successful)'
        required: false
  workflow_run:
    workflows: ["Load Tests"]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-load-tests
  cancel-in-progress: false

jobs:
  publish-data:
    name: Compute load-test dashboard data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write is for the perf-raw archive and dashboard-data pushes only.
    permissions:
      contents: write
      actions: read

    steps:
      - name: Require a successful source run
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        env:
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "::error title=Source run did not succeed::$SOURCE_WORKFLOW run $SOURCE_RUN_ID concluded $SOURCE_CONCLUSION; nothing was published"
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve Load Tests run ID
        id: resolve
        run: |
          RID="${INPUT_RUN_ID:-$EVENT_RUN_ID}"
          if [ -z "$RID" ]; then
            RID=$(gh run list --workflow "Load Tests" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "Auto-resolved latest successful Load Tests run: $RID"
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}

      - name: Download all load-test artifacts
        run: |
          mkdir -p artifacts/load-tests-raw

          echo "Downloading artifacts from run $RUN_ID..."

          # Download all artifacts matching load-test patterns
          # The load-tests workflow uploads:
          #   load-metrics                         (console harness)
          #   database-load-metrics-<provider>     (NBomber database)
          #   messaging-load-metrics               (NBomber messaging)
          #   caching-load-metrics-<provider>      (NBomber caching)
          #   locking-load-metrics-<provider>      (NBomber locking)
          #   broker-load-metrics-<provider>       (NBomber brokers)
          gh run download "$RUN_ID" \
            --pattern "*load-metrics*" \
            --dir artifacts/load-tests-raw \
            --repo dlrivada/Encina || echo "Warning: some artifacts may not be available"

          # Also try the consolidated load-metrics artifact
          gh run download "$RUN_ID" \
            --name "load-metrics" \
            --dir artifacts/load-tests-raw/harness \
            --repo dlrivada/Encina 2>/dev/null || echo "Note: no harness artifact found"

          echo ""
          echo "Downloaded artifacts:"
          find artifacts/load-tests-raw -type f | head -50
          echo ""
          echo "NBomber summaries found:"
          find artifacts/load-tests-raw -name "nbomber-summary.json" -o -name "*.json" -path "*/nbomber/*" | head -20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}

      - name: Read the base data from the dashboard-data branch
        # The base of latest.json (carry-forward) and history.json is the
        # branch, not the live site: live lags while a deploy is pending,
        # cancelled or failed. Nothing is written when the branch or the domain
        # is absent.
        shell: pwsh
        run: ./.github/scripts/pages-dashboard-data.ps1 -Mode Read -Domain load-tests -OutDir base/load-tests

      - name: Read the live base data from Pages
        # Second choice of base after the branch. A 404 writes nothing; any other
        # failure (HTTP error, timeout, invalid JSON) fails the job instead of
        # being taken for a first run or an empty history. Skipped when the
        # branch already carries both base files.
        if: hashFiles('base/load-tests/latest.json') == '' || hashFiles('base/load-tests/history.json') == ''
        shell: pwsh
        run: ./.github/scripts/pages-dashboard-data.ps1 -Mode Live -Domain load-tests -OutDir live/load-tests

      - name: Fetch previous snapshot for carry-forward
        run: |
          # Carry-forward copies modules from the previous snapshot that are NOT
          # present in the current run, keeping the dashboard complete when only
          # some categories run. Order: the dashboard-data branch copy (durable
          # record), the live Pages copy (a 404 means it does not exist; any
          # other failure already failed the Live step), the copy tracked in
          # main (only when Pages has no copy or a stale one), then an empty
          # snapshot (first clean run).
          mkdir -p artifacts/perf-previous
          if [ -s base/load-tests/latest.json ]; then
            cp -f base/load-tests/latest.json artifacts/perf-previous/latest.json
            echo "Using the previous snapshot from the dashboard-data branch."
            exit 0
          fi

          # Use Pages if it has data and NO stale "send_flow" scenario names.
          # The send_flow name was a bug from the initial parser that used NBomber's
          # internal scenario name instead of test_name+provider. Once Pages has
          # exclusively new-style names, this check can be simplified to just
          # "is Pages available?".
          if [ -s live/load-tests/latest.json ] && ! grep -q '"name": "send_flow"' live/load-tests/latest.json; then
            cp -f live/load-tests/latest.json artifacts/perf-previous/latest.json
            echo "Using the previous snapshot from Pages (clean naming)."
          elif [ -f docs/load-tests/data/latest.json ]; then
            cp docs/load-tests/data/latest.json artifacts/perf-previous/latest.json
            echo "Using repo copy (Pages has stale or no data)."
          else
            echo "No previous snapshot — first clean run."
            echo "{}" > artifacts/perf-previous/latest.json
          fi

      - name: Generate load-test report with carry-forward
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          dotnet run .github/scripts/perf-report.cs -- \
            --kind load-tests \
            --input artifacts/load-tests-raw \
            --output artifacts/perf-output \
            --run-id "$RUN_ID" \
            --sha ${{ github.sha }} \
            --carry-forward-from artifacts/perf-previous/latest.json

      - name: Stage fresh load-test data in the Pages overlay
        run: |
          # Only the files this workflow owns go into overlay/load-tests/; they are
          # persisted to the dashboard-data branch, which docs.yml deploys.
          mkdir -p overlay/load-tests/data
          cp -f artifacts/perf-output/latest.json overlay/load-tests/data/latest.json
          cp -f artifacts/perf-output/docref-index.json overlay/load-tests/data/docref-index.json 2>/dev/null || true
          # Copy archived timestamped snapshots
          find artifacts/perf-output -maxdepth 1 -name "*.json" \
            ! -name "latest.json" \
            ! -name "docref-index.json" \
            -exec cp -f {} overlay/load-tests/data/ \;
          ls -la overlay/load-tests/data/

      - name: Choose the history base (branch, else larger of live and main)
        run: |
          # Order: the dashboard-data branch copy when it exists and is non-empty;
          # otherwise the larger, by entry count, of the live Pages copy (a 404
          # means it does not exist; any other failure already failed the Live
          # step) and the copy tracked in main.
          if [ -s base/load-tests/history.json ]; then
            cp -f base/load-tests/history.json overlay/load-tests/data/history.json
            echo "Using the dashboard-data branch history ($(grep -c timestamp overlay/load-tests/data/history.json || true) entries)"
            exit 0
          fi
          cp -f docs/load-tests/data/history.json overlay/load-tests/data/history.json 2>/dev/null || echo "[]" > overlay/load-tests/data/history.json
          REPO_ENTRIES=$(grep -c timestamp overlay/load-tests/data/history.json 2>/dev/null) || REPO_ENTRIES=0
          if [ -s live/load-tests/history.json ] && head -c 1 live/load-tests/history.json | grep -q '^\['; then
            PAGES_ENTRIES=$(grep -c timestamp live/load-tests/history.json) || PAGES_ENTRIES=0
            if [ "$PAGES_ENTRIES" -ge "$REPO_ENTRIES" ]; then
              echo "Using Pages history ($PAGES_ENTRIES entries, repo has $REPO_ENTRIES)"
              cp -f live/load-tests/history.json overlay/load-tests/data/history.json
            else
              echo "Using repo history ($REPO_ENTRIES entries, Pages has $PAGES_ENTRIES)"
            fi
          else
            echo "Using repo history ($REPO_ENTRIES entries, no live history.json)"
          fi

      - name: Update load-tests history
        run: |
          dotnet run .github/scripts/perf-history.cs -- \
            --kind load-tests \
            --latest overlay/load-tests/data/latest.json \
            --history overlay/load-tests/data/history.json

      - name: Archive raw data to perf-raw branch
        continue-on-error: true
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -e
          DATE=$(date -u +"%Y-%m-%d")
          TARGET_DIR="load-tests/${DATE}/${RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git fetch origin perf-raw 2>/dev/null; then
            git worktree add .perf-raw origin/perf-raw
          else
            echo "perf-raw branch does not exist yet — skipping archival."
            exit 0
          fi

          mkdir -p ".perf-raw/${TARGET_DIR}"
          cp -r artifacts/load-tests-raw/* ".perf-raw/${TARGET_DIR}/" 2>/dev/null || true

          cat > ".perf-raw/${TARGET_DIR}/metadata.json" << EOF
          {
            "runId": ${RUN_ID},
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "workflow": "Load Tests",
            "kind": "load-tests"
          }
          EOF

          cd .perf-raw
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to archive."
          else
            git commit -m "perf-raw: archive load-tests run ${RUN_ID}"
            git push origin HEAD:perf-raw || echo "Warning: push to perf-raw failed."
          fi
          cd ..
          git worktree remove --force .perf-raw

      - name: Persist the overlay to the dashboard-data branch
        # Committed before the deploy is requested, so a deploy that the
        # "pages" group cancels, or that fails, loses no dashboard data: the
        # next deploy of any kind reads the branch inside the lock (#1386).
        shell: pwsh
        run: ./.github/scripts/pages-dashboard-data.ps1 -Mode Persist -Domain load-tests -OverlayRoot overlay

  deploy:
    name: Deploy site with fresh load-test data
    needs: publish-data
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
