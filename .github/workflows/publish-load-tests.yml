name: Publish Load Tests Data

# Triggered when the Load Tests workflow completes on main. The publish-data job
# downloads all load-test artifacts (console harness + NBomber scenarios), runs
# perf-report.cs --kind load-tests to produce a unified snapshot, archives raw
# data to perf-raw, computes the dashboard data (latest.json, history.json,
# docref-index.json) and uploads it as the artifact pages-overlay-load-tests.
# The deploy job then calls docs.yml, the only Pages deployer (#1381), which
# lays that overlay over the live data of every dashboard and deploys the
# whole site.
#
# A source run that did not succeed fails this workflow visibly instead of
# skipping it (#1361).
#
# Mirrors publish-benchmarks.yml; see ADR-025 for the architectural pattern.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Load Tests run ID to use (leave empty for latest successful)'
        required: false
  workflow_run:
    workflows: ["Load Tests"]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-load-tests
  cancel-in-progress: false

jobs:
  publish-data:
    name: Compute load-test dashboard data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write is for the perf-raw archive push only.
    permissions:
      contents: write
      actions: read

    steps:
      - name: Require a successful source run
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        env:
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "::error title=Source run did not succeed::$SOURCE_WORKFLOW run $SOURCE_RUN_ID concluded $SOURCE_CONCLUSION; nothing was published"
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve Load Tests run ID
        id: resolve
        run: |
          RID="${{ inputs.run_id || github.event.workflow_run.id }}"
          if [ -z "$RID" ]; then
            RID=$(gh run list --workflow "Load Tests" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "Auto-resolved latest successful Load Tests run: $RID"
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all load-test artifacts
        run: |
          RUN_ID="${{ steps.resolve.outputs.run_id }}"
          mkdir -p artifacts/load-tests-raw

          echo "Downloading artifacts from run $RUN_ID..."

          # Download all artifacts matching load-test patterns
          # The load-tests workflow uploads:
          #   load-metrics                         (console harness)
          #   database-load-metrics-<provider>     (NBomber database)
          #   messaging-load-metrics               (NBomber messaging)
          #   caching-load-metrics-<provider>      (NBomber caching)
          #   locking-load-metrics-<provider>      (NBomber locking)
          #   broker-load-metrics-<provider>       (NBomber brokers)
          gh run download "$RUN_ID" \
            --pattern "*load-metrics*" \
            --dir artifacts/load-tests-raw \
            --repo dlrivada/Encina || echo "Warning: some artifacts may not be available"

          # Also try the consolidated load-metrics artifact
          gh run download "$RUN_ID" \
            --name "load-metrics" \
            --dir artifacts/load-tests-raw/harness \
            --repo dlrivada/Encina 2>/dev/null || echo "Note: no harness artifact found"

          echo ""
          echo "Downloaded artifacts:"
          find artifacts/load-tests-raw -type f | head -50
          echo ""
          echo "NBomber summaries found:"
          find artifacts/load-tests-raw -name "nbomber-summary.json" -o -name "*.json" -path "*/nbomber/*" | head -20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch previous snapshot for carry-forward
        run: |
          # Carry-forward copies modules from the previous snapshot that are NOT
          # present in the current run, keeping the dashboard complete when only
          # some categories run. Fetch from Pages (most current), fall back to repo.
          mkdir -p artifacts/perf-previous
          PAGES_URL="https://dlrivada.github.io/Encina/load-tests/data/latest.json"
          PAGES_DATA=$(curl -fsSL "$PAGES_URL" 2>/dev/null || echo "")

          # Use Pages if it has data and NO stale "send_flow" scenario names.
          # The send_flow name was a bug from the initial parser that used NBomber's
          # internal scenario name instead of test_name+provider. Once Pages has
          # exclusively new-style names, this check can be simplified to just
          # "is Pages available?".
          if [ -n "$PAGES_DATA" ] && ! echo "$PAGES_DATA" | grep -q '"name": "send_flow"'; then
            echo "$PAGES_DATA" > artifacts/perf-previous/latest.json
            echo "Fetched previous snapshot from Pages (clean naming)."
          elif [ -f docs/load-tests/data/latest.json ]; then
            cp docs/load-tests/data/latest.json artifacts/perf-previous/latest.json
            echo "Using repo copy (Pages has stale or no data)."
          else
            echo "No previous snapshot — first clean run."
            echo "{}" > artifacts/perf-previous/latest.json
          fi

      - name: Generate load-test report with carry-forward
        run: |
          dotnet run .github/scripts/perf-report.cs -- \
            --kind load-tests \
            --input artifacts/load-tests-raw \
            --output artifacts/perf-output \
            --run-id ${{ steps.resolve.outputs.run_id }} \
            --sha ${{ github.sha }} \
            --carry-forward-from artifacts/perf-previous/latest.json

      - name: Stage fresh load-test data in the Pages overlay
        run: |
          # Only the files this workflow owns go into overlay/load-tests/; docs.yml
          # copies them over the live Pages data of every dashboard.
          mkdir -p overlay/load-tests/data
          cp -f artifacts/perf-output/latest.json overlay/load-tests/data/latest.json
          cp -f artifacts/perf-output/docref-index.json overlay/load-tests/data/docref-index.json 2>/dev/null || true
          # Copy archived timestamped snapshots
          find artifacts/perf-output -maxdepth 1 -name "*.json" \
            ! -name "latest.json" \
            ! -name "docref-index.json" \
            -exec cp -f {} overlay/load-tests/data/ \;
          ls -la overlay/load-tests/data/

      - name: Fetch live history from Pages (most complete)
        run: |
          cp -f docs/load-tests/data/history.json overlay/load-tests/data/history.json 2>/dev/null || echo "[]" > overlay/load-tests/data/history.json
          PAGES_URL="https://dlrivada.github.io/Encina/load-tests/data/history.json"
          PAGES_HISTORY=$(curl -fsSL "$PAGES_URL" 2>/dev/null || echo "")
          REPO_ENTRIES=$(grep -c timestamp overlay/load-tests/data/history.json 2>/dev/null) || REPO_ENTRIES=0
          if [ -n "$PAGES_HISTORY" ] && echo "$PAGES_HISTORY" | head -1 | grep -q '^\['; then
            PAGES_ENTRIES=$(echo "$PAGES_HISTORY" | grep -c timestamp) || PAGES_ENTRIES=0
            if [ "$PAGES_ENTRIES" -ge "$REPO_ENTRIES" ]; then
              echo "Using Pages history ($PAGES_ENTRIES entries, repo has $REPO_ENTRIES)"
              echo "$PAGES_HISTORY" > overlay/load-tests/data/history.json
            else
              echo "Using repo history ($REPO_ENTRIES entries, Pages has $PAGES_ENTRIES)"
            fi
          else
            echo "Using repo history ($REPO_ENTRIES entries, Pages not available)"
          fi

      - name: Update load-tests history
        run: |
          dotnet run .github/scripts/perf-history.cs -- \
            --kind load-tests \
            --latest overlay/load-tests/data/latest.json \
            --history overlay/load-tests/data/history.json

      - name: Archive raw data to perf-raw branch
        continue-on-error: true
        run: |
          set -e
          RUN_ID="${{ steps.resolve.outputs.run_id }}"
          DATE=$(date -u +"%Y-%m-%d")
          TARGET_DIR="load-tests/${DATE}/${RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git fetch origin perf-raw 2>/dev/null; then
            git worktree add .perf-raw origin/perf-raw
          else
            echo "perf-raw branch does not exist yet — skipping archival."
            exit 0
          fi

          mkdir -p ".perf-raw/${TARGET_DIR}"
          cp -r artifacts/load-tests-raw/* ".perf-raw/${TARGET_DIR}/" 2>/dev/null || true

          cat > ".perf-raw/${TARGET_DIR}/metadata.json" << EOF
          {
            "runId": ${RUN_ID},
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "workflow": "Load Tests",
            "kind": "load-tests"
          }
          EOF

          cd .perf-raw
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to archive."
          else
            git commit -m "perf-raw: archive load-tests run ${RUN_ID}"
            git push origin HEAD:perf-raw || echo "Warning: push to perf-raw failed."
          fi
          cd ..
          git worktree remove --force .perf-raw

      - name: Upload Pages overlay
        uses: actions/upload-artifact@v7
        with:
          name: pages-overlay-load-tests
          path: overlay/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy site with fresh load-test data
    needs: publish-data
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      overlay-artifact: pages-overlay-load-tests
