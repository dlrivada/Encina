name: Publish Benchmarks Data

# Triggered when the Benchmarks workflow completes on main. The publish-data job
# downloads the consolidated perf-report artifact and the raw data artifact,
# archives raw data to the `perf-raw` orphan branch, computes the dashboard data
# (latest.json, history.json, docref-index.json, fingerprints.json,
# benchmark-coverage.json, badge.json) and commits it to the dashboard-data
# branch (.github/scripts/pages-dashboard-data.ps1, #1386). The deploy job then
# calls docs.yml, the only Pages deployer (#1381), which renders the benchmark
# tables and, inside the "pages" lock, lays the data of every dashboard over
# the site and deploys it.
#
# A source run that did not succeed fails this workflow visibly instead of
# skipping it (#1361), unless its "Aggregate all benchmark results" job succeeded:
# then the partial snapshot is published with a warning naming the matrix jobs that
# did not succeed (#2510; carrying their previous series forward is #1575). A successful `short` run is still skipped with a notice
# (see "Detect source job type"); the daily dashboard-freshness check flags the
# dashboard when no `medium` run has published for too long.
#
# See ADR-025 + performance-measurement-methodology.md.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Benchmarks run ID to use (leave empty for latest successful)'
        required: false
  workflow_run:
    workflows: ["Benchmarks"]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-benchmarks
  cancel-in-progress: false

jobs:
  publish-data:
    name: Compute benchmarks dashboard data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write is for the perf-raw archive and dashboard-data pushes only.
    permissions:
      contents: write
      actions: read
    outputs:
      skip: ${{ steps.guard.outputs.skip == 'true' && 'true' || steps.jobtype.outputs.skip }}

    steps:
      # A source run that did not conclude `success` normally refuses to publish.
      # The one exception (#2510): a matrix job failed or was cancelled (for example
      # one class hit its job timeout) but the "Aggregate all benchmark results" job
      # of that run succeeded, so latest.json holds every series that did get
      # measured. That partial snapshot is published with a loud warning and a step
      # summary naming each matrix job that did not succeed (#1761). Carrying the
      # previous series forward for the missing classes is #1575; this step does not
      # reconcile anything. When the aggregate job did not succeed (or does not
      # exist, e.g. the whole run was cancelled), nothing is published.
      # A run cancelled before any job ran was superseded in the concurrency queue
      # of benchmarks.yml (#2852): the newer run publishes, so skip with a notice
      # instead of failing. A cancelled run that has jobs behaves as before.
      - name: Require a successful source run (or a successful aggregate)
        id: guard
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          AGGREGATE_JOB: Aggregate all benchmark results
        run: |
          set -euo pipefail
          JOBS_URL="repos/$REPO/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100&filter=latest"
          if [ "$SOURCE_CONCLUSION" = "cancelled" ]; then
            TOTAL=$(gh api "$JOBS_URL" --jq '.total_count')
            if [ "$TOTAL" = "0" ]; then
              echo "::notice title=Source run superseded::Benchmarks run $SOURCE_RUN_ID was superseded in the concurrency queue before any job ran; the newer run publishes."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          AGGREGATE=$(gh api --paginate "$JOBS_URL" \
            --jq ".jobs[] | select(.name == env.AGGREGATE_JOB) | (.conclusion // \"unknown\")")
          if [ "$AGGREGATE" != "success" ]; then
            echo "::error title=Source run did not succeed::$SOURCE_WORKFLOW run $SOURCE_RUN_ID concluded $SOURCE_CONCLUSION and its '$AGGREGATE_JOB' job is '${AGGREGATE:-missing}'; nothing was published"
            exit 1
          fi
          MISSING=$(gh api --paginate "$JOBS_URL" \
            --jq ".jobs[] | select(.name != env.AGGREGATE_JOB and ((.conclusion // \"unknown\") | IN(\"success\", \"skipped\") | not)) | \"\(.name) (\(.conclusion // \"unknown\"))\"")
          COUNT=$(printf '%s\n' "$MISSING" | grep -c . || true)
          LIST=$(printf '%s\n' "$MISSING" | paste -sd ',' - | sed 's/,/, /g')
          echo "::warning title=Partial benchmarks publish::$SOURCE_WORKFLOW run $SOURCE_RUN_ID concluded $SOURCE_CONCLUSION but '$AGGREGATE_JOB' succeeded; publishing a partial snapshot. $COUNT job(s) did not succeed and their series are missing until the next complete run (carry-forward is #1575): $LIST"
          {
            echo "### Partial benchmarks publish"
            echo ""
            echo "Source run $SOURCE_RUN_ID concluded **$SOURCE_CONCLUSION**; the aggregate job succeeded, so its snapshot is published. These $COUNT matrix job(s) did not succeed and their series are missing from this snapshot (#1575 tracks carrying the previous series forward):"
            echo ""
            printf '%s\n' "$MISSING" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET SDK
        if: steps.guard.outputs.skip != 'true'
        uses:actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve Benchmarks run ID
        id: resolve
        if: steps.guard.outputs.skip != 'true'
        run: |
          RID="${INPUT_RUN_ID:-$EVENT_RUN_ID}"
          if [ -z "$RID" ]; then
            RID=$(gh run list --workflow "Benchmarks" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "Auto-resolved latest successful Benchmarks run: $RID"
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}

      - name: Download perf-report artifact
        if: steps.guard.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: perf-report-benchmarks
          path: perf-report-artifact
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download raw benchmark data
        if: steps.guard.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: perf-raw-benchmarks-${{ steps.resolve.outputs.run_id }}
          path: raw-data
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Gate: only `medium`/`default` jobs are allowed to update the dashboard.
      # `short` and `dry` use IterationCount=3 and force every benchmark into the
      # "unstable" bucket (perf-report.cs enforces n >= 10 for stability, or a
      # stricter 3 % CoV for n in 3..9). Publishing their latest.json would overwrite
      # the dashboard with a ~18 % stable snapshot even though the underlying code
      # is fine, so we early-exit here. `unknown` is treated the same way — it
      # almost always means a workflow misconfiguration (PERF_JOB_TYPE env var not
      # propagated) and publishing silently would hide the bug.
      #
      # Raw artifacts remain available on the Benchmarks workflow page for
      # developer inspection; only the Pages-published dashboard is gated.
      - name: Detect source job type
        id: jobtype
        if: steps.guard.outputs.skip != 'true'
        run: |
          JOB_TYPE=$(jq -r '.metadata.jobType // "unknown"' perf-report-artifact/latest.json)
          echo "job_type=$JOB_TYPE" >> "$GITHUB_OUTPUT"
          echo "Source run jobType: $JOB_TYPE"
          case "$JOB_TYPE" in
            medium|default)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            unknown)
              echo ""
              echo "::warning title=Skipping publish::Source run metadata.jobType is 'unknown'. This usually means the PERF_JOB_TYPE env var was not propagated to the aggregate job in benchmarks.yml. Fix the workflow, re-run, and the publish will proceed automatically."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo ""
              echo "::notice title=Skipping publish::Source run used --job $JOB_TYPE (IterationCount < 10); every benchmark would be reported as unstable. The run's artifacts remain available on the Benchmarks workflow page for inspection. Re-run with job_type=medium (or wait for the weekly schedule) to update the public dashboard."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Stage fresh benchmarks data in the Pages overlay
        if: steps.guard.outputs.skip != 'true' && steps.jobtype.outputs.skip != 'true'
        run: |
          # Only the files this workflow owns go into overlay/benchmarks/; they are
          # persisted to the dashboard-data branch, which docs.yml deploys.
          mkdir -p overlay/benchmarks/data
          cp -f perf-report-artifact/latest.json overlay/benchmarks/data/latest.json
          cp -f perf-report-artifact/docref-index.json overlay/benchmarks/data/docref-index.json 2>/dev/null || true
          # Phase 2 — publish current fingerprints so the next run can diff against them.
          cp -f perf-report-artifact/fingerprints.json overlay/benchmarks/data/fingerprints.json 2>/dev/null || true
          # Copy any archived timestamped snapshot file
          find perf-report-artifact -maxdepth 1 -name "*.json" \
            ! -name "latest.json" \
            ! -name "docref-index.json" \
            ! -name "fingerprints.json" \
            -exec cp -f {} overlay/benchmarks/data/ \;
          ls -la overlay/benchmarks/data/

      - name: Read the base data from the dashboard-data branch
        # The base of history.json is the branch, not the live site: live lags
        # while a deploy is pending, cancelled or failed. Nothing is written when
        # the branch or the domain is absent.
        if: steps.guard.outputs.skip != 'true' && steps.jobtype.outputs.skip != 'true'
        shell: pwsh
        run: ./.github/scripts/pages-dashboard-data.ps1 -Mode Read -Domain benchmarks -OutDir base/benchmarks

      - name: Read the live base data from Pages
        # Second choice of base after the branch. A 404 writes nothing; any other
        # failure (HTTP error, timeout, invalid JSON) fails the job instead of
        # being taken for an empty history. Skipped when the branch already
        # carries history.json.
        if: steps.guard.outputs.skip != 'true' && steps.jobtype.outputs.skip != 'true' && hashFiles('base/benchmarks/history.json') == ''
        shell: pwsh
        run: ./.github/scripts/pages-dashboard-data.ps1 -Mode Live -Domain benchmarks -OutDir live/benchmarks

      - name: Choose the history base (branch, else larger of live and main)
        if: steps.guard.outputs.skip != 'true' && steps.jobtype.outputs.skip != 'true'
        run: |
          # Order: the dashboard-data branch copy when it exists and is non-empty
          # (durable record); otherwise the larger, by entry count, of the live
          # Pages copy (a 404 means it does not exist yet; any other failure
          # already failed the Live step) and the copy tracked in main (stale
          # because nothing commits it back).
          if [ -s base/benchmarks/history.json ]; then
            cp -f base/benchmarks/history.json overlay/benchmarks/data/history.json
            echo "Using the dashboard-data branch history ($(grep -c timestamp overlay/benchmarks/data/history.json || true) entries)"
            exit 0
          fi
          cp -f docs/benchmarks/data/history.json overlay/benchmarks/data/history.json 2>/dev/null || echo "[]" > overlay/benchmarks/data/history.json
          # grep -c returns exit code 1 when count=0, so capture separately
          REPO_ENTRIES=$(grep -c timestamp overlay/benchmarks/data/history.json 2>/dev/null) || REPO_ENTRIES=0

          if [ -s live/benchmarks/history.json ] && head -c 1 live/benchmarks/history.json | grep -q '^\['; then
            PAGES_ENTRIES=$(grep -c timestamp live/benchmarks/history.json) || PAGES_ENTRIES=0
            if [ "$PAGES_ENTRIES" -ge "$REPO_ENTRIES" ]; then
              echo "Using Pages history ($PAGES_ENTRIES entries, repo has $REPO_ENTRIES)"
              cp -f live/benchmarks/history.json overlay/benchmarks/data/history.json
            else
              echo "Using repo history ($REPO_ENTRIES entries, Pages has $PAGES_ENTRIES)"
            fi
          else
            echo "Using repo history ($REPO_ENTRIES entries, no live history.json)"
          fi

      - name: Update benchmarks history
        if: steps.guard.outputs.skip != 'true' && steps.jobtype.outputs.skip != 'true'
        run: |
          dotnet run .github/scripts/perf-history.cs -- \
            --kind benchmarks \
            --latest overlay/benchmarks/data/latest.json \
            --history overlay/benchmarks/data/history.json

      - name: Generate regression badge
        if: steps.guard.outputs.skip != 'true' && steps.jobtype.outputs.skip != 'true'
        run: |
          dotnet run .github/scripts/perf-badge.cs -- \
            --input overlay/benchmarks/data/latest.json \
            --output overlay/benchmarks/badge.json

      - name: Generate dynamic benchmark coverage scan
        if: steps.guard.outputs.skip != 'true' && steps.jobtype.outputs.skip != 'true'
        continue-on-error: true
        run: |
          dotnet run .github/scripts/perf-coverage-scan.cs -- \
            --src-root src \
            --manifest-dir .github/perf-manifest \
            --nbomber-root tests/Encina.NBomber \
            --loadtests-root tests/Encina.LoadTests \
            --output overlay/benchmarks/data/benchmark-coverage.json

      # Raw data is archived regardless of jobType so short runs can be
      # re-processed later via perf-recalculate.cs against the archived
      # BenchmarkDotNet artifacts (the raw files carry enough statistics for
      # a higher-quality re-run report). The archive is append-only.
      - name: Archive raw data to perf-raw branch
        if: steps.guard.outputs.skip != 'true' && hashFiles('raw-data/**') != ''
        continue-on-error: true
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -e
          DATE=$(date -u +"%Y-%m-%d")
          TARGET_DIR="benchmarks/${DATE}/${RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch or create perf-raw branch
          if git fetch origin perf-raw 2>/dev/null; then
            git worktree add .perf-raw origin/perf-raw
          else
            echo "perf-raw branch does not exist yet. Creating orphan branch."
            git worktree add --orphan -b perf-raw .perf-raw
            cd .perf-raw
            git rm -rf . 2>/dev/null || true
            cat > README.md << 'EOF'
          # perf-raw — Raw performance measurement archive

          This orphan branch stores uncompressed raw output from BenchmarkDotNet
          and NBomber runs, one directory per CI workflow run. It exists to
          enable unlimited historical recalculation of performance metrics
          when the measurement methodology evolves, bypassing the 90-day
          retention of GitHub Actions artifacts.

          See ADR-025 (Performance Measurement Infrastructure) and
          `docs/testing/performance-measurement-methodology.md` for the full
          rationale.

          ## Layout

          ```
          benchmarks/
            <YYYY-MM-DD>/
              <runId>/
                metadata.json
                <Module>/BenchmarkDotNet.Artifacts/results/*.json
          load-tests/
            <YYYY-MM-DD>/
              <runId>/
                metadata.json
                nbomber-<stamp>/
                metrics-<stamp>.csv
          ```

          ## Policy

          - Never rewritten; append-only.
          - Unbounded growth accepted per ADR-025 §2 (zero-cost storage on
            public repositories).
          - Compression, pruning, or migration to a different store can be
            introduced later without breaking `perf-recalculate.cs`, which
            iterates whatever directories happen to exist.
          EOF
            git add README.md
            git commit -m "chore(perf-raw): initialize orphan branch"
            cd ..
          fi

          mkdir -p ".perf-raw/${TARGET_DIR}"
          cp -r raw-data/* ".perf-raw/${TARGET_DIR}/" 2>/dev/null || true

          # Write metadata
          cat > ".perf-raw/${TARGET_DIR}/metadata.json" << EOF
          {
            "runId": ${RUN_ID},
            "sha": "${{ github.sha }}",
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "workflow": "Benchmarks",
            "kind": "benchmarks"
          }
          EOF

          cd .perf-raw
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to archive."
          else
            git commit -m "perf-raw: archive benchmarks run ${RUN_ID}"
            git push origin HEAD:perf-raw || echo "Warning: push to perf-raw failed; will retry on next run."
          fi
          cd ..
          git worktree remove --force .perf-raw

      - name: Persist the overlay to the dashboard-data branch
        # Committed before the deploy is requested, so a deploy that the
        # "pages" group cancels, or that fails, loses no dashboard data: the
        # next deploy of any kind reads the branch inside the lock (#1386).
        if: steps.guard.outputs.skip != 'true' && steps.jobtype.outputs.skip != 'true'
        shell: pwsh
        run: ./.github/scripts/pages-dashboard-data.ps1 -Mode Persist -Domain benchmarks -OverlayRoot overlay

  deploy:
    name: Deploy site with fresh benchmarks data
    needs: publish-data
    # A skipped `short`/`unknown` source run publishes nothing (see the gate above).
    if: needs.publish-data.outputs.skip != 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
