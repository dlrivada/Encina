name: Documentation

# Builds the documentation site (Jekyll narrative + DocFX API reference)
# and deploys to GitHub Pages. See issue #91 for the hybrid architecture.
#
# Scopes:
#   Jekyll  -> docs/**/*.md (just-the-docs theme, narrative content)
#   DocFX   -> src/**/*.csproj (API reference from XML comments) -> /api/
#
# This is the ONLY workflow that deploys GitHub Pages (#1381). Pages uses
# build_type "workflow", so every deploy replaces the whole site. The dashboard
# publishers (publish-coverage/-mutations/-benchmarks/-load-tests) compute
# their data, commit it to the orphan branch `dashboard-data` (the durable
# record of each dashboard's last published data) and call this workflow
# through workflow_call. See .github/scripts/pages-dashboard-data.ps1 (#1386).
#   build-docs (no lock, ~15 minutes):
#     1. stages the live Pages data and the dashboard-data branch in
#        _dashboards/, only to render the covref/mutref/perf citation markers
#        into docs/ (INV-002: rendering never blocks the deploy),
#     2. builds Jekyll + DocFX, adds the rendered cited-by.json files and
#        uploads the site, WITHOUT the dashboard data, as the docs-site artifact.
#   deploy (inside the "pages" concurrency lock):
#     3. lays the dashboard data over the site: the live Pages copy, then the
#        dashboard-data branch; any read failure fails the deploy,
#     4. uploads and deploys the site and smoke-checks it.
# Reading the data inside the lock means no deploy can revert data another
# deploy published while this one was building, and a pending deploy that the
# "pages" group cancels loses nothing: its data is already on the branch and
# the deploy that superseded it publishes it.
# Pull requests build the site and never deploy.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**/*.cs'
      - 'src/**/*.csproj'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - '.github/workflows/docs.yml'
      - '.github/scripts/cov-docs-render.cs'
      - '.github/scripts/mut-docs-render.cs'
      - '.github/scripts/perf-docs-render.cs'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**/*.cs'
      - 'src/**/*.csproj'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - '.github/workflows/docs.yml'
      - '.github/scripts/cov-docs-render.cs'
      - '.github/scripts/mut-docs-render.cs'
      - '.github/scripts/perf-docs-render.cs'
  workflow_dispatch:
  # The dashboard publishers call this workflow after committing their data to
  # the dashboard-data branch; the deploy job reads it from there.
  workflow_call:

# No workflow-level concurrency: the "pages" group lives on the deploy job only,
# so a publisher calling this workflow cannot deadlock on its own group.

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    # configure-pages@v5 needs pages:write to enable the Pages environment.
    # id-token is only required by deploy-pages@v5 (deploy job) — don't
    # grant OIDC to PR validation runs.
    permissions:
      contents: read
      pages: write

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Fetch live dashboard data from Pages
        # Staged only for the citation renderers below (docref-index.json) and
        # for the live cited-by.json a skipped renderer leaves in place. The
        # dashboard data itself is laid over the site by the deploy job, inside
        # the "pages" lock (#1386). Gated to the deploy path: pull requests
        # never deploy, so they skip the network calls.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          for domain in coverage benchmarks load-tests mutations; do
            echo "Fetching live $domain data from Pages..."
            mkdir -p "_dashboards/$domain/data"
            for file in latest.json history.json docref-index.json fingerprints.json cited-by.json benchmark-coverage.json; do
              url="https://dlrivada.github.io/Encina/$domain/data/$file"
              if curl -fsSL -o "_dashboards/$domain/data/$file.new" "$url" 2>/dev/null; then
                mv "_dashboards/$domain/data/$file.new" "_dashboards/$domain/data/$file"
                echo "  ✓ $domain/data/$file"
              else
                rm -f "_dashboards/$domain/data/$file.new"
                echo "  - $domain/data/$file (not on Pages)"
              fi
            done
            # Badges live at /<domain>/badge.{svg,json} (referenced from README).
            for badge in badge.svg badge.json; do
              url="https://dlrivada.github.io/Encina/$domain/$badge"
              if curl -fsSL -o "_dashboards/$domain/$badge.new" "$url" 2>/dev/null; then
                mv "_dashboards/$domain/$badge.new" "_dashboards/$domain/$badge"
                echo "  ✓ $domain/$badge"
              else
                rm -f "_dashboards/$domain/$badge.new"
              fi
            done
          done

      - name: Stage persisted dashboard data for the renderers
        # The dashboard-data branch is at least as fresh as the live copy (a
        # publisher commits to it before its deploy), so its docref indexes
        # win for the citations. INV-002: a problem here only leaves the
        # citations older; the deploy job re-reads the data and fails loudly.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          if ! git ls-remote --exit-code --heads origin refs/heads/dashboard-data > /dev/null; then
            echo "No dashboard-data branch yet; the renderers use the live data"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin +refs/heads/dashboard-data:refs/remotes/origin/dashboard-data
          mkdir -p _persisted _dashboards
          git archive refs/remotes/origin/dashboard-data | tar -x -C _persisted
          for domain in coverage benchmarks load-tests mutations; do
            if [ -d "_persisted/$domain" ]; then
              mkdir -p "_dashboards/$domain"
              cp -R "_persisted/$domain/." "_dashboards/$domain/"
              echo "  staged persisted $domain data"
            fi
          done

      - name: Render covref markers in documentation + build cited-by.json
        # INV-002: a rendering problem must never block the Pages deploy.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f _dashboards/coverage/data/docref-index.json ]; then
            echo "No coverage DocRef index available; skipping covref rendering"
            exit 0
          fi
          # Scan docs/ AND src/ (per-package READMEs may cite coverage). The renderer
          # writes cited-by.json next to the index it reads (_dashboards/coverage/data).
          dotnet run .github/scripts/cov-docs-render.cs -- \
            --docref-index _dashboards/coverage/data/docref-index.json \
            --docs-root docs \
            --scan-roots src

      - name: Render mutref markers in documentation + build cited-by.json
        # INV-002: a rendering problem must never block the Pages deploy.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f _dashboards/mutations/data/docref-index.json ]; then
            echo "No mutation DocRef index available; skipping mutref rendering"
            exit 0
          fi
          # Scan docs/ AND src/ (per-package READMEs may cite mutation results).
          dotnet run .github/scripts/mut-docs-render.cs -- \
            --docref-index _dashboards/mutations/data/docref-index.json \
            --docs-root docs \
            --scan-roots src

      - name: Render benchmark tables in documentation + build cited-by.json
        # INV-002: a rendering problem must never block the Pages deploy.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f _dashboards/benchmarks/data/docref-index.json ]; then
            echo "No benchmarks DocRef index available; skipping benchmark table rendering"
            exit 0
          fi
          dotnet run .github/scripts/perf-docs-render.cs -- \
            --docref-index _dashboards/benchmarks/data/docref-index.json \
            --docs-root docs

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore Encina.slnx

      - name: Build solution (XML docs generation)
        run: dotnet build Encina.slnx --configuration Release --no-restore

      - name: Generate API metadata (DocFX)
        run: dotnet docfx metadata docs/docfx.json --warningsAsErrors false

      - name: Build API reference site (DocFX)
        run: dotnet docfx build docs/docfx.json --warningsAsErrors false

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
          future: false
          verbose: false

      - name: Fix _site ownership
        # jekyll-build-pages@v1 runs inside a Docker container and writes
        # _site/ as a different UID/GID, so subsequent native steps cannot
        # modify it. Reclaim ownership for the runner user before merging.
        shell: bash
        run: sudo chown -R "$USER:$USER" _site

      - name: Merge DocFX API reference into Jekyll site
        shell: bash
        run: |
          if [ ! -d docs/_api-build ] || [ -z "$(ls -A docs/_api-build 2>/dev/null)" ]; then
            echo "::error::DocFX output directory docs/_api-build is missing or empty"
            exit 1
          fi
          if [ ! -f docs/_api-build/index.html ]; then
            echo "::error::DocFX output docs/_api-build/index.html not found — build produced no landing page"
            exit 1
          fi
          mkdir -p _site/api
          cp -r docs/_api-build/. _site/api/
          file_count=$(find _site/api -maxdepth 1 -type f | wc -l)
          echo "API reference merged into _site/api/ ($file_count files at root)"
          ls _site/api/index.html _site/api/favicon.ico

      - name: Copy the rendered cited-by.json files into the site
        # The build owns cited-by.json (the renderers write it from the docref
        # indexes, or the live copy stays when a renderer skipped). Every other
        # dashboard file is laid over the site by the deploy job.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          for domain in coverage benchmarks load-tests mutations; do
            if [ -f "_dashboards/$domain/data/cited-by.json" ]; then
              mkdir -p "_site/$domain/data"
              cp -f "_dashboards/$domain/data/cited-by.json" "_site/$domain/data/cited-by.json"
              echo "  $domain/data/cited-by.json"
            fi
          done

      - name: Package the built site
        # A single tar keeps every file and mode (as upload-pages-artifact
        # does) and uploads far faster than thousands of loose files.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: tar -cf docs-site.tar -C _site .

      - name: Upload the built site for the deploy job
        # Only upload when we intend to deploy (main branch). Skipping on PR
        # avoids avoidable failures for forked PRs and keeps PR validation
        # limited to build correctness.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs-site.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build-docs
    # Only deploy from main to prevent workflow_dispatch overwriting Pages from
    # feature branches. Skips on PRs (build-only validation).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    # Serializes every Pages deploy (docs pushes and the dashboard publishers,
    # which reach this job through workflow_call). Job level, not workflow
    # level, so a caller never waits on a group it already holds. Everything
    # that reads the dashboard data happens inside this lock (#1386); a pending
    # deploy the group cancels loses nothing, because the data it would have
    # published is on the dashboard-data branch and the deploy that replaced
    # it reads that branch.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout the dashboard-data script and the site registry
        # The assemble step runs the script and reads the dashboard-data branch
        # through this checkout's origin; the smoke check reads the list of
        # published sites and data feeds from the registry (#1382).
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/pages-dashboard-data.ps1
            tools/ai/sites.json
          sparse-checkout-cone-mode: false

      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: _site-artifact

      - name: Unpack the built site
        shell: bash
        run: |
          mkdir -p _site
          tar -xf _site-artifact/docs-site.tar -C _site

      - name: Lay the current dashboard data over the site
        # Inside the lock: the live Pages data of every dashboard, then the
        # dashboard-data branch on top. A failed read fails the deploy; the
        # committed docs/*/data copies are never published in their place.
        shell: pwsh
        run: ./.github/scripts/pages-dashboard-data.ps1 -Mode Assemble -SiteRoot _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke-check the published site
        # Fails the deploy when a registered site is not rendered as expected (a
        # raw copy of docs/ like #1381), the API reference is missing, or a
        # dashboard or its data is not served. Retries absorb Pages propagation
        # delay. The path (and dataPath) list and the text/html expectation come
        # from tools/ai/sites.json (#1382): adding a site means adding one entry.
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}/"
          registry="tools/ai/sites.json"
          mapfile -t paths < <(jq -r '.sites[].path' "$registry")
          mapfile -t expect_html < <(jq -r '.sites[] | (.expectHtml // false)' "$registry")
          mapfile -t data_paths < <(jq -r '.sites[] | select(.dataPath != null) | .dataPath' "$registry")
          for p in "${data_paths[@]}"; do
            paths+=("$p")
            expect_html+=("false")
          done
          attempts=6
          delay=20
          failures=0
          for i in "${!paths[@]}"; do
            path="${paths[$i]}"
            want_html="${expect_html[$i]}"
            url="${base}${path}"
            status="000"
            ctype=""
            for attempt in $(seq 1 "$attempts"); do
              out=$(curl -sS -L -o /dev/null -w '%{http_code} %{content_type}' "$url" 2>/dev/null || echo "000 ")
              status="${out%% *}"
              ctype="${out#* }"
              if [ "$status" = "200" ]; then
                if [ "$want_html" != "true" ] || [[ "$ctype" == text/html* ]]; then
                  break
                fi
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                sleep "$delay"
              fi
            done
            if [ "$status" != "200" ]; then
              echo "::error title=Pages smoke check failed::$url returned HTTP $status after $attempts attempts"
              failures=$((failures + 1))
            elif [ "$want_html" = "true" ] && [[ "$ctype" != text/html* ]]; then
              echo "::error title=Pages smoke check failed::$url returned Content-Type '$ctype', expected text/html (unrendered site?)"
              failures=$((failures + 1))
            else
              echo "OK $status $url"
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "$failures URL(s) failed the smoke check."
            exit 1
          fi
