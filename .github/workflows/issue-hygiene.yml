name: Issue hygiene

# An issue is complete or it does not exist (maintainer rule of 2026-10-06, #1926): it has a milestone, one
# priority label (p0-mandatory, p1-recommended or p2-post-1.0; an [EPIC] needs none) and it is on user project 1
# (the project part is done locally, see below).
#
# On every issue event this workflow
#   - labels it needs-triage (and, for an issue by the owner, a member or a collaborator, comments once) when the milestone or the priority label is missing, and removes
#     the label again when both are present.
# The weekly run (and workflow_dispatch) lists every open issue missing a milestone or a priority label in the job
# summary, with the project column when the default token can read the project.
#
# Project membership is not written here: the default GITHUB_TOKEN cannot write user projects and no long-lived
# secret is used (maintainer decision 2026-10-07, #1987). open-remediation.ps1 adds the issues it opens, the
# open-issue skill adds the others, and tools/ai/issues/check-project-membership.ps1 (run locally) finds the web-created
# ones.
#
# Setup (one time, by the maintainer):
#   - The needs-triage label is created by the job when it is missing; to create it by hand:
#       gh label create needs-triage --repo dlrivada/Encina --color FBCA04 --description "Missing milestone or priority label"

on:
  issues:
    types: [opened, edited, milestoned, demilestoned, labeled, unlabeled]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: issue-hygiene-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  hygiene:
    name: Issue hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
      contents: read
    steps:
      - name: Check milestone and priority label
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const PRIORITY = ['p0-mandatory', 'p1-recommended', 'p2-post-1.0'];
            const TRIAGE = 'needs-triage';
            const MARKER = '<!-- issue-hygiene -->';
            const PROJECT_NUMBER = 1;

            const isEpic = (issue) => issue.title.startsWith('[EPIC]');
            const labelNames = (issue) => issue.labels.map(l => (typeof l === 'string' ? l : l.name));
            function missingOf(issue) {
              const missing = [];
              if (!issue.milestone) missing.push('milestone');
              if (!isEpic(issue) && !labelNames(issue).some(n => PRIORITY.includes(n))) missing.push('priority label (' + PRIORITY.join(' | ') + ')');
              return missing;
            }

            async function ensureTriageLabel() {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: TRIAGE });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({ owner, repo, name: TRIAGE, color: 'FBCA04', description: 'Missing milestone or priority label' });
              }
            }

            async function handleIssue(eventIssue) {
              // The event payload is a snapshot: a queued run for a later event would otherwise judge stale labels.
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: eventIssue.number });
              if (issue.state !== 'open') return;

              const missing = missingOf(issue);
              const hasTriage = labelNames(issue).includes(TRIAGE);
              if (missing.length > 0) {
                if (!hasTriage) {
                  await ensureTriageLabel();
                  await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: [TRIAGE] });
                }
                // Outside reporters cannot set a milestone or a priority label: they are labelled silently.
                if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(issue.author_association)) return;
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue.number, per_page: 100 });
                if (!comments.some(c => c.body && c.body.includes(MARKER))) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: issue.number,
                    body: MARKER + '\nThis issue is incomplete. Missing: ' + missing.join(', ') + '.\n\nAn issue needs a milestone and one priority label (`p0-mandatory`, `p1-recommended` or `p2-post-1.0`; an `[EPIC]` needs no priority). The `needs-triage` label is removed automatically once both are set.'
                  });
                }
              } else if (hasTriage) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: TRIAGE });
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
              }
            }

            if (context.eventName === 'issues') {
              await handleIssue(context.payload.issue);
              return;
            }

            // Scheduled / manual run: report every open issue that is not complete.
            const open = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 }))
              .filter(i => !i.pull_request);

            let onProject = null;
            let projectReadError = null;
            // A permission failure (the default token cannot see a user project) differs from a transient one.
            const isPermissionError = (e) => e && !/rate limit|abuse/i.test(String(e.message)) && (e.status === 401 || e.status === 403 ||/FORBIDDEN|NOT_FOUND|Resource not accessible|Could not resolve/i.test(String(e.message)) || e instanceof TypeError);
            // Reading a public user project may work with the default token; when it does not, the column is dropped.
            try {
              onProject = new Set();
              let cursor = null;
              for (;;) {
                const r = await github.graphql(
                  'query($login:String!,$number:Int!,$after:String){ user(login:$login){ projectV2(number:$number){ items(first:100, after:$after){ pageInfo{ hasNextPage endCursor } nodes{ content{ ... on Issue { number repository{ nameWithOwner } } } } } } } }',
                  { login: owner, number: PROJECT_NUMBER, after: cursor });
                const items = r.user.projectV2.items;
                for (const n of items.nodes) {
                  if (n.content && n.content.number && n.content.repository && n.content.repository.nameWithOwner === owner + '/' + repo) onProject.add(n.content.number);
                }
                if (!items.pageInfo.hasNextPage) break;
                cursor = items.pageInfo.endCursor;
              }
            } catch (e) {
              core.warning('Project membership could not be read with the default token: ' + (e.status ? 'HTTP ' + e.status + ' ' : '') + e.message);
              onProject = null;
              projectReadError = e;
            }

            const rows = [];
            for (const issue of open) {
              const missing = missingOf(issue);
              if (onProject && !onProject.has(issue.number)) missing.push('project');
              if (missing.length > 0) rows.push([issue.html_url, issue.title, missing.join(', ')]);
            }

            const header = [{ data: 'Issue', header: true }, { data: 'Title', header: true }, { data: 'Missing', header: true }];
            core.summary.addHeading('Incomplete open issues (' + rows.length + ' of ' + open.length + ')', 2);
            const whyNotChecked = isPermissionError(projectReadError) ? 'the default token cannot read the project' : 'the read failed (see the job log warning)';
            if (!onProject) core.summary.addRaw('Project membership is not checked here (' + whyNotChecked + '); run tools/ai/issues/check-project-membership.ps1 locally to find open issues that are not on project 1 (-Add adds them).\n\n', true);
            if (rows.length > 0) core.summary.addTable([header, ...rows]);
            else core.summary.addRaw(onProject ? 'Every open issue has a milestone, a priority label and a project.\n' : 'Every open issue has a milestone and a priority label.\n', true);
            await core.summary.write();
