name: SBOM

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: write
    id-token: write

jobs:
    generate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: 10.0.x

            - name: Restore dependencies
              run: dotnet restore Encina.slnx

            - name: Generate SBOM
              run: dotnet publish src/Encina/Encina.csproj --configuration Release --output artifacts/package

            - name: Create output directory
              run: mkdir -p artifacts/sbom

            - name: Create SBOM with Syft
              uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
              with:
                  path: artifacts/package
                  format: spdx-json
                  output-file: artifacts/sbom/sbom.spdx.json

            - name: Upload SBOM artifact
              uses: actions/upload-artifact@v7
              with:
                  name: sbom
                  path: artifacts/sbom/sbom.spdx.json
