name: Mutation Tests

on:
  workflow_dispatch:
    inputs:
      diff_mode:
        description: "Only mutate files changed since main (collapses matrix to 1 shard)"
        type: boolean
        default: false
      full_mode:
        description: "Mutate ALL files in one shard (very slow). Default: the shard matrix."
        type: boolean
        default: false
      custom_scope:
        description: "Override mutation scope: one glob, or several separated by ';' with '!' for exclusions (collapses matrix to 1 shard). e.g. **/Pipeline/Behaviors/*.cs"
        type: string
        default: ""
  schedule:
    # Run weekly on Fridays at 3:00 AM UTC
    - cron: "0 3 * * 5"

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_SDK_VERSION: '10.0.x'

jobs:
  # Phase 1 — Select matrix shards.
  #
  # Default (scheduled run, or dispatch without overrides): emits one matrix
  # entry per SHARDS element, so every weekly run mutates all the rotation
  # folders of src/Encina/Encina.csproj in parallel.
  #
  # Dispatch overrides (custom_scope / full_mode / diff_mode) collapse the
  # matrix to a single shard so operators can target narrow scopes without
  # spawning the whole matrix.
  select-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      mode: ${{ steps.build.outputs.mode }}
      shard_count: ${{ steps.build.outputs.shard_count }}
    steps:
      - name: Build matrix
        id: build
        # workflow_dispatch inputs pass through env: instead of being
        # interpolated into the script via ${{ }}. Direct interpolation
        # of user-controlled inputs is the classic GitHub Actions script
        # injection vector (see GitHub Security hardening guide). With
        # env: bash consumes the values as variables, not as literal text
        # expanded at template time.
        env:
          CUSTOM_SCOPE: ${{ inputs.custom_scope }}
          FULL_MODE: ${{ inputs.full_mode }}
          DIFF_MODE: ${{ inputs.diff_mode }}
        run: |
          # Shard design (#1441, #1682). Stryker.NET 5 runs with the
          # Microsoft Testing Platform runner, which ignores
          # test-case-filter (stryker-net#3757): every mutant runs the whole
          # Encina.UnitTests project (~22,000 tests, ~35.6 s per mutant
          # measured locally in spike #1087). A shard's duration therefore
          # grows with its tested-mutant count, not with its folder, so
          # shards are sized to about 150 tested mutants or fewer.
          #
          # A SHARDS entry is one or more Stryker mutate globs separated by
          # ';'. A glob that starts with '!' excludes files. A folder too big
          # for one shard is split by file: one or more shards name its
          # largest files, and the folder's last shard takes the folder glob
          # minus those files, so a file added to the folder later always
          # lands in some shard. The aggregate job fails when two shard
          # reports hold mutants of the same file.
          #
          # The counts in the comments are tested mutants (every status
          # except Ignored, CompileError and NoCoverage) from run
          # 36959365309 (2026-10-02), and from run 36304862790 for
          # Modules/Isolation, whose shard lost its runner in 36959365309
          # (#1682). Two single files exceed 150; a file is the smallest
          # shard unit because the aggregate merge keys reports by file.
          SHARDS=(
            "**/Core/EncinaConfiguration.cs;**/Core/ServiceCollectionExtensions.cs;**/Core/Encina.cs"                                    # 0: 140
            "**/Core/*.cs;!**/Core/EncinaConfiguration.cs;!**/Core/ServiceCollectionExtensions.cs;!**/Core/Encina.cs"                    # 1: 80
            "**/Pipeline/Behaviors/*.cs"                                                                                                 # 2: 142
            "**/Pipeline/*.cs"                                                                                                           # 3: 136
            "**/Dispatchers/Strategies/*.cs"                                                                                             # 4: 64
            "**/Validation/*.cs;**/Results/*.cs;**/Sharding/Health/*.cs"                                                                 # 5: 29 + 16 + 57
            "**/Sharding/Migrations/Strategies/*.cs;**/Sharding/Execution/*.cs"                                                          # 6: 59 + 60
            "**/Sharding/Routing/GeoShardRouter.cs;**/Sharding/Routing/RangeShardRouter.cs"                                              # 7: 121
            "**/Sharding/Routing/*.cs;!**/Sharding/Routing/GeoShardRouter.cs;!**/Sharding/Routing/RangeShardRouter.cs"                   # 8: 127
            "**/Sharding/ReplicaSelection/*.cs"                                                                                          # 9: 151
            "**/Sharding/Shadow/**/*.cs"                                                                                                 # 10: 115
            "**/Sharding/Colocation/*.cs;**/Sharding/Diagnostics/*.cs"                                                                   # 11: 58 + 66
            "**/Sharding/TimeBased/TimeBasedShardRouter.cs;**/Sharding/TimeBased/ShardTierInfo.cs;**/Sharding/TimeBased/TierTransition.cs" # 12: 142
            "**/Sharding/TimeBased/*.cs;!**/Sharding/TimeBased/TimeBasedShardRouter.cs;!**/Sharding/TimeBased/ShardTierInfo.cs;!**/Sharding/TimeBased/TierTransition.cs" # 13: 139
            "**/Sharding/Resharding/Phases/ReshardingPhaseExecutor.cs;**/Sharding/Resharding/Phases/CuttingOverPhase.cs"                 # 14: 89
            "**/Sharding/Resharding/Phases/*.cs;!**/Sharding/Resharding/Phases/ReshardingPhaseExecutor.cs;!**/Sharding/Resharding/Phases/CuttingOverPhase.cs" # 15: 113
            "**/Modules/Isolation/SqlServerPermissionScriptGenerator.cs"                                                                 # 16: 201
            "**/Modules/Isolation/PostgreSqlPermissionScriptGenerator.cs"                                                                # 17: 185
            "**/Modules/Isolation/SqlSchemaExtractor.cs;**/Modules/Isolation/ModuleSchemaRegistry.cs"                                    # 18: 108
            "**/Modules/Isolation/*.cs;!**/Modules/Isolation/SqlServerPermissionScriptGenerator.cs;!**/Modules/Isolation/PostgreSqlPermissionScriptGenerator.cs;!**/Modules/Isolation/SqlSchemaExtractor.cs;!**/Modules/Isolation/ModuleSchemaRegistry.cs" # 19: 58
          )
          # Per-shard job timeout in minutes, same index as SHARDS.
          # PROVISIONAL (#1441): no CI run of the MTP runner exists yet, so
          # these come from the #1395 formula max(60, ceil(round(minutes) x
          # 1.5)) applied to an estimate, minutes = 20 (setup: restore, build,
          # Stryker's build and initial test run) + tested mutants x 35.6 s
          # (spike #1087, local). The first validation run re-sizes them from
          # observed shard durations with the same formula. GitHub caps a job
          # at 360 minutes; 340 is this workflow's ceiling.
          TIMEOUTS=(
            155
            101
            156
            152
            87
            122
            137
            138
            143
            165
            132
            141
            156
            153
            110
            131
            209
            195
            126
            81
          )

          if [ "${#SHARDS[@]}" -ne "${#TIMEOUTS[@]}" ]; then
            echo "::error::SHARDS (${#SHARDS[@]}) and TIMEOUTS (${#TIMEOUTS[@]}) must have the same length" >&2
            exit 1
          fi

          if [ -n "$CUSTOM_SCOPE" ]; then
            # Custom scope: reuse the paired timeout if the scope equals a
            # SHARDS entry; otherwise fall back to the largest configured
            # timeout so an arbitrary scope still gets a generous budget
            # instead of the job's implicit default.
            TIMEOUT=""
            for i in "${!SHARDS[@]}"; do
              if [ "${SHARDS[$i]}" = "$CUSTOM_SCOPE" ]; then
                TIMEOUT="${TIMEOUTS[$i]}"
                break
              fi
            done
            if [ -z "$TIMEOUT" ]; then
              TIMEOUT=0
              for t in "${TIMEOUTS[@]}"; do
                if [ "$t" -gt "$TIMEOUT" ]; then
                  TIMEOUT="$t"
                fi
              done
            fi
            MATRIX=$(jq -nc --arg scope "$CUSTOM_SCOPE" --argjson timeout "$TIMEOUT" \
              '[{idx: "custom", scope: $scope, timeout: $timeout}]')
            MODE="custom"
          elif [ "$FULL_MODE" = "true" ]; then
            # Mutates every file in one shard: always needs the largest
            # configured budget.
            MATRIX=$(jq -nc '[{idx: "full", scope: "**/*.cs", timeout: 340}]')
            MODE="full"
          elif [ "$DIFF_MODE" = "true" ]; then
            MATRIX=$(jq -nc '[{idx: "diff", scope: "**/*.cs", timeout: 340}]')
            MODE="diff"
          else
            # Default: emit every SHARDS entry as a matrix shard.
            ENTRIES=""
            for i in "${!SHARDS[@]}"; do
              ENTRY=$(jq -nc --arg idx "$i" --arg scope "${SHARDS[$i]}" --argjson timeout "${TIMEOUTS[$i]}" \
                '{idx: $idx, scope: $scope, timeout: $timeout}')
              if [ -z "$ENTRIES" ]; then
                ENTRIES="$ENTRY"
              else
                ENTRIES="$ENTRIES,$ENTRY"
              fi
            done
            MATRIX="[$ENTRIES]"
            MODE="matrix"
          fi

          COUNT=$(echo "$MATRIX" | jq 'length')
          {
            echo "matrix=$MATRIX"
            echo "mode=$MODE"
            echo "shard_count=$COUNT"
          } >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"
          echo "Shard count: $COUNT"
          echo "Matrix:"
          echo "$MATRIX" | jq .

  # Diagnostic baseline — runs once in parallel with the matrix instead of
  # once per shard. Stryker runs in project mode from tests/Encina.UnitTests
  # (#1441), so a failing test there breaks every shard's initial test run
  # (break-on-initial-test-failure); this job shows which test fails.
  test-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ env.DOTNET_SDK_VERSION }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ env.DOTNET_SDK_VERSION }}
            ${{ runner.os }}-nuget

      - name: Restore
        run: dotnet restore tests/Encina.UnitTests/Encina.UnitTests.csproj

      - name: Build
        run: dotnet build tests/Encina.UnitTests/Encina.UnitTests.csproj --configuration Debug --no-restore

      - name: Run the Stryker test project (diagnostic baseline)
        run: |
          mkdir -p artifacts/test-baseline
          for proj in \
            tests/Encina.UnitTests/Encina.UnitTests.csproj; do
            name=$(basename "$proj" .csproj)
            echo "::group::$name"
            dotnet test "$proj" \
              --configuration Debug \
              --logger "trx;LogFileName=${name}.trx" \
              --results-directory artifacts/test-baseline \
              2>&1 | tee "artifacts/test-baseline/${name}.log" || true
            echo "::endgroup::"
          done

      - name: Upload diagnostic baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-test-baseline
          path: artifacts/test-baseline
          if-no-files-found: ignore

  # Phase 2 — Run mutation tests per shard.
  #
  # With fail-fast: false, a single-shard failure does not abort the other
  # matrix entries. continue-on-error: true at the job level prevents any
  # shard failure from failing the overall workflow conclusion, so the
  # downstream publish-mutations workflow (which requires success) still
  # runs as long as the aggregate job succeeds.
  run-mutation-tests:
    needs: select-matrix
    runs-on: ubuntu-latest
    # Per-shard budget from the matrix, not one fixed value: see the
    # TIMEOUTS array in select-matrix and its sizing notes (#1395).
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ env.DOTNET_SDK_VERSION }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ env.DOTNET_SDK_VERSION }}
            ${{ runner.os }}-nuget

      - name: Cache dotnet tools
        uses: actions/cache@v6
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-dotnet-tools-${{ env.DOTNET_SDK_VERSION }}
          restore-keys: |
            ${{ runner.os }}-dotnet-tools-${{ env.DOTNET_SDK_VERSION }}
            ${{ runner.os }}-dotnet-tools

      # Stryker builds tests/Encina.UnitTests (Debug, the project's default
      # configuration) and runs only that project (project mode, #1441), so
      # the shard restores and builds that project alone; the build here is
      # an early failure gate and leaves Stryker an incremental build.
      - name: Restore
        run: dotnet restore tests/Encina.UnitTests/Encina.UnitTests.csproj

      - name: Build
        run: dotnet build tests/Encina.UnitTests/Encina.UnitTests.csproj --configuration Debug --no-restore

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Run mutation tests (shard ${{ matrix.idx }})
        id: stryker
        # Pass matrix fields + select-matrix outputs via env: rather than
        # ${{ }} template interpolation. matrix.scope carries the
        # user-controlled `custom_scope` input in custom mode — an
        # attacker-crafted value like `"; rm -rf / #` would otherwise
        # execute in the runner shell. Same script-injection hardening as
        # the "Build matrix" step above.
        env:
          MATRIX_IDX: ${{ matrix.idx }}
          MATRIX_SCOPE: ${{ matrix.scope }}
          SELECT_MODE: ${{ needs.select-matrix.outputs.mode }}
        run: |
          mkdir -p artifacts/mutation/logs
          SCOPE="$MATRIX_SCOPE"
          MODE="$SELECT_MODE"

          echo "Shard idx: $MATRIX_IDX"
          echo "Scope: $SCOPE"
          echo "Mode: $MODE"

          # Record runner memory and disk once a minute (#1682: a shard lost
          # its hosted runner without leaving a log). The file is uploaded
          # with the Stryker logs when the job fails or is cancelled; every
          # fifth reading also goes to the step log, which keeps the lines
          # written before a lost runner stops reporting. The EXIT trap
          # stops the loop, so the step still ends with Stryker.
          (
            minute=0
            while true; do
              {
                date -u +%Y-%m-%dT%H:%M:%SZ
                free -m
                df -h /
              } >> artifacts/mutation/logs/runner-resources.log 2>&1
              if [ $((minute % 5)) -eq 0 ]; then
                echo "[runner-resources] $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                free -m
                df -h /
              fi
              minute=$((minute + 1))
              sleep 60
            done
          ) < /dev/null 2>&1 &
          MONITOR_PID=$!
          trap 'kill "$MONITOR_PID" 2>/dev/null || true' EXIT

          # Build --mutate args: every ';'-separated glob of the shard scope,
          # then the standard exclusions.
          #
          # Stored as a bash array (not a space-joined string) so every
          # element is passed as a single argv entry when expanded via
          # "${MUTATE_ARGS[@]}". The scope value comes from workflow_dispatch
          # input `custom_scope` in custom mode, so an unquoted expansion
          # would be a command-injection surface — word-splitting could let
          # crafted whitespace in the scope spill into neighbouring args,
          # and glob expansion could substitute matching filenames from the
          # runner working tree.
          #
          # There is no test-case-filter: the MTP runner ignores it
          # (stryker-net#3757), so every mutant runs the whole
          # Encina.UnitTests project and shards are sized by mutant count.
          IFS=';' read -ra SCOPE_GLOBS <<< "$SCOPE"
          MUTATE_ARGS=()
          INCLUDES=0
          for glob in "${SCOPE_GLOBS[@]}"; do
            if [ -z "$glob" ]; then
              continue
            fi
            MUTATE_ARGS+=("--mutate:$glob")
            if [ "${glob:0:1}" != "!" ]; then
              INCLUDES=$((INCLUDES + 1))
            fi
          done
          if [ "$INCLUDES" -eq 0 ]; then
            echo "::error::Shard scope '$SCOPE' has no include glob (only empty or '!' entries)."
            exit 1
          fi
          for excl in '!**/Log.cs' '!**/LogMessages.cs' '!**/Diagnostics/*ActivitySource.cs' '!**/Diagnostics/*Metrics.cs' '!**/*Errors.cs' '!**/*Constants.cs'; do
            MUTATE_ARGS+=("--mutate:$excl")
          done

          # Always expand MUTATE_ARGS via "${MUTATE_ARGS[@]}" (quoted) so
          # each array element becomes exactly one argv entry — no word
          # splitting, no glob expansion.
          if [ "$MODE" = "diff" ]; then
            echo "Running diff mode (vs main)"
            dotnet run --file .github/scripts/run-stryker.cs -- --since:main "${MUTATE_ARGS[@]}"
          elif [ "$MODE" = "full" ]; then
            echo "Running full mode (all files — will exceed the 340-min shard timeout)"
            # Pass MUTATE_ARGS so the CLI exclusion list stays the single
            # source of truth; otherwise full_mode would silently drift if
            # MUTATE_ARGS gains an exclusion the config file does not have.
            dotnet run --file .github/scripts/run-stryker.cs -- "${MUTATE_ARGS[@]}"
          else
            echo "Running shard scope: $SCOPE"
            dotnet run --file .github/scripts/run-stryker.cs -- "${MUTATE_ARGS[@]}"
          fi

      - name: Locate mutation report
        id: stryker-report
        if: always()
        run: |
          # Stryker writes the report to one of:
          #   - artifacts/mutation/reports/mutation-report.json (direct)
          #   - artifacts/mutation/<timestamp>/reports/mutation-report.json
          #     (when it adds a timestamp subdirectory)
          # artifacts/mutation/logs/ also exists (the runner-resources log,
          # and Stryker's own logs when `--log-to-file` is passed) — that
          # directory sorts lexicographically AFTER numeric timestamps, so a
          # naive "newest subdirectory under artifacts/mutation" lookup picks
          # `logs/` and silently misses the real report (reported by
          # Copilot on #1030).
          #
          # Search directly for any mutation-report.json under a
          # `reports/` subdirectory anywhere beneath artifacts/mutation.
          # `-printf '%T@ %p\n'` + `sort -rn` picks the newest by mtime
          # so timestamped runs are unambiguous; paths with spaces are
          # handled because cut -f2- keeps everything after the epoch.
          # GNU find is available on ubuntu-latest.
          report=$(find artifacts/mutation -type f -name "mutation-report.json" -path "*/reports/*" -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -n 1 | cut -d' ' -f2-)
          if [ -n "$report" ]; then
            reports_dir=$(dirname "$report")
            echo "reports-dir=$reports_dir" >> "$GITHUB_OUTPUT"
            echo "summary-file=$reports_dir/mutation-report.txt" >> "$GITHUB_OUTPUT"
          fi

      # The report steps run even when the Stryker step failed (#1682): a
      # report that Stryker wrote before failing is still uploaded, and the
      # aggregate job decides what to do with it.
      - name: Publish shard text summary
        if: always() && steps.stryker-report.outputs.summary-file != ''
        # matrix.scope carries user input in custom mode; the value only
        # reaches the job summary (no shell execution), but passing via
        # env: keeps the hardening consistent and prevents a future edit
        # from accidentally evaluating it.
        env:
          MATRIX_IDX: ${{ matrix.idx }}
          MATRIX_SCOPE: ${{ matrix.scope }}
          SUMMARY_FILE: ${{ steps.stryker-report.outputs.summary-file }}
        run: |
          if [ -f "$SUMMARY_FILE" ]; then
            {
              echo "### Mutation Report — Shard ${MATRIX_IDX} (\`${MATRIX_SCOPE}\`)";
              echo '```';
              cat "$SUMMARY_FILE";
              echo '```';
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload shard mutation report
        if: always() && steps.stryker-report.outputs.reports-dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-shard-${{ matrix.idx }}
          path: ${{ steps.stryker-report.outputs.reports-dir }}
          if-no-files-found: error

      - name: Upload Stryker logs (shard ${{ matrix.idx }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-logs-shard-${{ matrix.idx }}
          path: artifacts/mutation/logs
          if-no-files-found: ignore

      # #1440: the VsTest runner reported 0 killed on every shard for weeks
      # and every job stayed green. A report that tested mutants and killed
      # none means the runner did not activate the mutants, so the shard
      # fails; the aggregate job also refuses to publish such a report.
      # Only the default matrix is guarded: a custom or diff scope can test
      # a handful of mutants that all legitimately survive.
      - name: Fail a shard that killed no mutant
        if: always() && steps.stryker-report.outputs.reports-dir != '' && needs.select-matrix.outputs.mode == 'matrix'
        env:
          MATRIX_IDX: ${{ matrix.idx }}
          REPORTS_DIR: ${{ steps.stryker-report.outputs.reports-dir }}
        run: |
          REPORT="$REPORTS_DIR/mutation-report.json"
          TESTED=$(jq '[.files[] | (.mutants // [])[] | select(.status == "Killed" or .status == "Survived" or .status == "Timeout")] | length' "$REPORT")
          KILLED=$(jq '[.files[] | (.mutants // [])[] | select(.status == "Killed")] | length' "$REPORT")
          echo "Shard $MATRIX_IDX: $TESTED tested mutants (Killed, Survived or Timeout), $KILLED killed"
          if [ "$TESTED" -gt 0 ] && [ "$KILLED" -eq 0 ]; then
            echo "::error title=No mutant killed::Shard $MATRIX_IDX tested $TESTED mutants and killed none; the test runner did not activate the mutants (#1440)"
            exit 1
          fi

  # Phase 3 — Aggregate shard reports into a single mutation-report artifact.
  #
  # publish-mutations.yml downloads an artifact named `mutation-report` and
  # runs mutation-history.cs on it. This job produces that artifact by
  # merging the `files` maps from every successful shard's report.
  #
  # if: always() so aggregate still runs if some shards failed. A downstream
  # check guards against the 0-shards-succeeded case.
  aggregate:
    needs: [select-matrix, run-mutation-tests]
    if: always() && needs.select-matrix.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Download shard reports
        # actions/download-artifact@v8 fails the step when a `pattern:` matches
        # no artifacts. Swallow that failure so the merge step below owns the
        # 0-shards case and emits a clearer "no reports found" error.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: mutation-report-shard-*
          path: shards

      - name: Merge shard reports
        id: merge
        # SHARD_COUNT is derived from jq 'length' over a JSON built with
        # --arg, so it's always a number — but pass it via env: for
        # consistency with the rest of the workflow's injection hardening.
        # MATRIX_JSON carries the custom_scope input in custom mode; it is
        # only read by jq here, never evaluated by the shell.
        env:
          SHARD_COUNT: ${{ needs.select-matrix.outputs.shard_count }}
          MATRIX_JSON: ${{ needs.select-matrix.outputs.matrix }}
          SELECT_MODE: ${{ needs.select-matrix.outputs.mode }}
        run: |
          mkdir -p artifacts/mutation/reports shards
          mapfile -t REPORTS < <(find shards -name "mutation-report.json" -type f | sort)
          SUCCESSFUL=${#REPORTS[@]}

          # A shard that lost its runner, timed out before Stryker wrote the
          # report, or failed earlier uploads nothing (#1682). The merge
          # goes on with the other shards, and the missing ones are named in
          # a warning and in the step summary so the run is not taken for a
          # complete one.
          MISSING=()
          while IFS= read -r idx; do
            if [ -z "$(find shards -type f -name mutation-report.json -path "shards/mutation-report-shard-${idx}/*" -print -quit)" ]; then
              MISSING+=("$idx")
            fi
          done < <(jq -r '.[].idx' <<< "$MATRIX_JSON")
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::warning title=Missing shard reports::${#MISSING[@]} of $SHARD_COUNT shards uploaded no mutation report: ${MISSING[*]}. Their files keep their previous dashboard data."
            {
              echo '### Missing shard reports';
              echo '';
              echo "> [!WARNING]";
              echo "> ${#MISSING[@]} of $SHARD_COUNT shards uploaded no mutation report: shard(s) ${MISSING[*]}. Check those jobs (lost runner, timeout or failure)."
              echo '';
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$SUCCESSFUL" -eq 0 ]; then
            echo "::error::No shard reports found. All $SHARD_COUNT shards failed to produce mutation-report.json."
            exit 1
          fi

          echo "Merging $SUCCESSFUL / $SHARD_COUNT shard reports:"
          printf '  - %s\n' "${REPORTS[@]}"

          # #1440: a report that tested mutants and killed none comes from a
          # runner that did not activate the mutants. Publishing it would
          # show 0 % for its files as if it were a measurement. Only the
          # default matrix is guarded (see the shard step of the same name).
          ZERO_KILLED=()
          for report in "${REPORTS[@]}"; do
            if [ "$SELECT_MODE" != "matrix" ]; then
              break
            fi
            TESTED=$(jq '[.files[] | (.mutants // [])[] | select(.status == "Killed" or .status == "Survived" or .status == "Timeout")] | length' "$report")
            KILLED=$(jq '[.files[] | (.mutants // [])[] | select(.status == "Killed")] | length' "$report")
            if [ "$TESTED" -gt 0 ] && [ "$KILLED" -eq 0 ]; then
              ZERO_KILLED+=("$report ($TESTED tested)")
            fi
          done
          if [ "${#ZERO_KILLED[@]}" -gt 0 ]; then
            echo "::error title=No mutant killed::Shard reports that tested mutants and killed none (the runner did not activate the mutants, #1440); nothing is published:"
            printf '  - %s\n' "${ZERO_KILLED[@]}"
            exit 1
          fi

          # Combine every shard's `files` map into one. A shard lists every
          # file of the project it mutated, including the files that belong to
          # other shards' folders, with an empty `mutants` array (#1681). A
          # plain `add` lets the last shard's empty entry overwrite the entry
          # that has the mutants, so each shard's empty entries are dropped
          # before combining. Metadata (thresholds, projectRoot, etc.) inherits
          # from shard[0].
          # A file with mutants in two shards means overlapping folder globs:
          # fail with the file names instead of silently overwriting one.
          DUPLICATES=$(jq -s -r '[.[] | .files | to_entries[]
              | select((.value.mutants // []) | length > 0) | .key]
            | group_by(.) | map(select(length > 1) | .[0]) | .[]' "${REPORTS[@]}")
          if [ -n "$DUPLICATES" ]; then
            echo "::error::Files with mutants in more than one shard report (overlapping folder globs):"
            echo "$DUPLICATES"
            exit 1
          fi

          jq -s '(.[0]) + {files: (map(.files | with_entries(select((.value.mutants // []) | length > 0))) | add // {})}' \
            "${REPORTS[@]}" > artifacts/mutation/reports/mutation-report.json

          # Guard: the merge must neither lose nor invent mutants.
          EXPECTED=$(jq -s '[.[] | .files | to_entries[] | (.value.mutants // []) | length] | add // 0' "${REPORTS[@]}")

          MUTANTS=$(jq '[.files | to_entries[] | .value.mutants // [] | length] | add // 0' \
            artifacts/mutation/reports/mutation-report.json)
          FILES=$(jq '.files | length' artifacts/mutation/reports/mutation-report.json)

          if [ "$MUTANTS" -ne "$EXPECTED" ]; then
            echo "::error::Merged report has $MUTANTS mutants but the $SUCCESSFUL shard reports hold $EXPECTED."
            exit 1
          fi

          {
            echo "successful=$SUCCESSFUL"
            echo "mutants=$MUTANTS"
            echo "files=$FILES"
          } >> "$GITHUB_OUTPUT"

          {
            echo '### Matrix Aggregation';
            echo '';
            echo "| Metric | Value |";
            echo "|--------|------:|";
            echo "| Shards attempted | $SHARD_COUNT |";
            echo "| Shards with reports | $SUCCESSFUL |";
            echo "| Shards missing a report | ${#MISSING[@]}${MISSING[*]:+ (${MISSING[*]})} |";
            echo "| Mutated files | $FILES |";
            echo "| Mutants | $MUTANTS |";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize aggregated results
        run: |
          output=$(dotnet run --file .github/scripts/update-mutation-summary.cs)
          echo "$output"
          {
            echo '';
            echo '### Mutation Summary (Aggregated)';
            echo '```';
            echo "$output";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregated mutation report
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: artifacts/mutation/reports
          if-no-files-found: error
