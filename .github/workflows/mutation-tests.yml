name: Mutation Tests

on:
  workflow_dispatch:
    inputs:
      diff_mode:
        description: "Only mutate files changed since main (collapses matrix to 1 shard)"
        type: boolean
        default: false
      full_mode:
        description: "Mutate ALL files in one shard (very slow). Default: the shard matrix."
        type: boolean
        default: false
      custom_scope:
        description: "Override mutation scope: one glob, or several separated by ';' with '!' for exclusions (collapses matrix to 1 shard). e.g. **/Pipeline/Behaviors/*.cs"
        type: string
        default: ""
  schedule:
    # Weekly, Friday 03:00 UTC (restored by #1441 with the MTP runner)
    - cron: "0 3 * * 5"

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_SDK_VERSION: '10.0.x'

jobs:
  # Phase 1 — Select matrix shards.
  #
  # Default (scheduled run, or dispatch without overrides): emits one matrix
  # entry per SHARDS element, so every weekly run mutates all the rotation
  # folders of src/Encina/Encina.csproj in parallel.
  #
  # Dispatch overrides (custom_scope / full_mode / diff_mode) collapse the
  # matrix to a single shard so operators can target narrow scopes without
  # spawning the whole matrix.
  select-matrix:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      mode: ${{ steps.build.outputs.mode }}
      shard_count: ${{ steps.build.outputs.shard_count }}
    steps:
      - name: Build matrix
        id: build
        # workflow_dispatch inputs pass through env: instead of being
        # interpolated into the script via ${{ }}. Direct interpolation
        # of user-controlled inputs is the classic GitHub Actions script
        # injection vector (see GitHub Security hardening guide). With
        # env: bash consumes the values as variables, not as literal text
        # expanded at template time.
        env:
          CUSTOM_SCOPE: ${{ inputs.custom_scope }}
          FULL_MODE: ${{ inputs.full_mode }}
          DIFF_MODE: ${{ inputs.diff_mode }}
        run: |
          # Shard design (#1441, #1682). Stryker.NET 5 runs with the
          # Microsoft Testing Platform runner, which ignores
          # test-case-filter (stryker-net#3757): every mutant runs the whole
          # Encina.UnitTests project (~22,000 tests). Stryker runs at
          # concurrency 1 (.github/stryker-config.json; stryker-net#3832), so
          # a shard's duration grows with its tested-mutant count, not with
          # its folder.
          #
          # PENDING MEASUREMENT (#1441 phase 2): the entries below are still
          # the phase-1 split, sized to about 150 tested mutants at the local
          # 35.6 s per mutant of spike #1087 and concurrency 2. The CI
          # calibration runs of phase 2 measure the seconds per mutant on
          # the runner at concurrency 1; SHARDS and TIMEOUTS are re-sized
          # from that number, not before.
          #
          # A SHARDS entry is one or more Stryker mutate globs separated by
          # ';'. A glob that starts with '!' excludes files. A folder too big
          # for one shard is split by file: one or more shards name its
          # largest files, and the folder's last shard takes the folder glob
          # minus those files, so a file added to the folder later always
          # lands in some shard.
          #
          # A single file too big for one shard is split with Stryker's text
          # span suffix '{start..end}'. The bounds are CHARACTER offsets in
          # the file (UTF-16, LF line endings as checked out on the runner),
          # not line numbers. Split a file in two with the same N in both
          # shards:
          #   "**/Dir/Big.cs{0..N}"                  (first part)
          #   "**/Dir/Big.cs;!**/Dir/Big.cs{0..N}"   (the rest)
          # Stryker keeps a mutant only when an include span contains it
          # whole and no exclude span contains it whole, so a mutant that
          # straddles N goes to the second shard and every mutant lands in
          # exactly one shard, whatever N is; N only balances the halves
          # (pick an offset between two members). Build checks below that
          # every span exclusion has its include twin and the other way
          # round. The aggregate job merges the shard reports of a split
          # file mutant by mutant and fails when two reports tested the same
          # mutant.
          #
          # The counts in the comments are tested mutants (every status
          # except Ignored, CompileError and NoCoverage) from run
          # 36959365309 (2026-10-02), and from run 36304862790 for
          # Modules/Isolation, whose shard lost its runner in 36959365309
          # (#1682). Shards 16 and 17 are the two files over 150
          # (SqlServerPermissionScriptGenerator.cs and
          # PostgreSqlPermissionScriptGenerator.cs); they are the candidates
          # for a span split once the per-mutant time is measured.
          SHARDS=(
            "**/Core/EncinaConfiguration.cs;**/Core/ServiceCollectionExtensions.cs;**/Core/Encina.cs"                                    # 0: 140
            "**/Core/*.cs;!**/Core/EncinaConfiguration.cs;!**/Core/ServiceCollectionExtensions.cs;!**/Core/Encina.cs"                    # 1: 80
            "**/Pipeline/Behaviors/*.cs"                                                                                                 # 2: 142
            "**/Pipeline/*.cs"                                                                                                           # 3: 136
            "**/Dispatchers/Strategies/*.cs"                                                                                             # 4: 64
            "**/Validation/*.cs;**/Results/*.cs;**/Sharding/Health/*.cs"                                                                 # 5: 29 + 16 + 57
            "**/Sharding/Migrations/Strategies/*.cs;**/Sharding/Execution/*.cs"                                                          # 6: 59 + 60
            "**/Sharding/Routing/GeoShardRouter.cs;**/Sharding/Routing/RangeShardRouter.cs"                                              # 7: 121
            "**/Sharding/Routing/*.cs;!**/Sharding/Routing/GeoShardRouter.cs;!**/Sharding/Routing/RangeShardRouter.cs"                   # 8: 127
            "**/Sharding/ReplicaSelection/*.cs"                                                                                          # 9: 151
            "**/Sharding/Shadow/**/*.cs"                                                                                                 # 10: 115
            "**/Sharding/Colocation/*.cs;**/Sharding/Diagnostics/*.cs"                                                                   # 11: 58 + 66
            "**/Sharding/TimeBased/TimeBasedShardRouter.cs;**/Sharding/TimeBased/ShardTierInfo.cs;**/Sharding/TimeBased/TierTransition.cs" # 12: 142
            "**/Sharding/TimeBased/*.cs;!**/Sharding/TimeBased/TimeBasedShardRouter.cs;!**/Sharding/TimeBased/ShardTierInfo.cs;!**/Sharding/TimeBased/TierTransition.cs" # 13: 139
            "**/Sharding/Resharding/Phases/ReshardingPhaseExecutor.cs;**/Sharding/Resharding/Phases/CuttingOverPhase.cs"                 # 14: 89
            "**/Sharding/Resharding/Phases/*.cs;!**/Sharding/Resharding/Phases/ReshardingPhaseExecutor.cs;!**/Sharding/Resharding/Phases/CuttingOverPhase.cs" # 15: 113
            "**/Modules/Isolation/SqlServerPermissionScriptGenerator.cs"                                                                 # 16: 201
            "**/Modules/Isolation/PostgreSqlPermissionScriptGenerator.cs"                                                                # 17: 185
            "**/Modules/Isolation/SqlSchemaExtractor.cs;**/Modules/Isolation/ModuleSchemaRegistry.cs"                                    # 18: 108
            "**/Modules/Isolation/*.cs;!**/Modules/Isolation/SqlServerPermissionScriptGenerator.cs;!**/Modules/Isolation/PostgreSqlPermissionScriptGenerator.cs;!**/Modules/Isolation/SqlSchemaExtractor.cs;!**/Modules/Isolation/ModuleSchemaRegistry.cs" # 19: 58
          )
          # Per-shard job timeout in minutes, same index as SHARDS.
          # PROVISIONAL, PENDING MEASUREMENT (#1441 phase 2): no CI run of
          # the MTP runner has finished yet, so these come from the #1395
          # formula max(60, ceil(round(minutes) x 1.5)) applied to an
          # estimate, minutes = 20 (setup: restore, build, Stryker's build
          # and initial test run) + tested mutants x 35.6 s (spike #1087,
          # local, concurrency 2). The phase-2 calibration runs measure the
          # runner's seconds per mutant at concurrency 1, and both arrays are
          # re-sized from it with the same formula. GitHub caps a job at 360
          # minutes; 340 is this workflow's ceiling.
          TIMEOUTS=(
            155
            101
            156
            152
            87
            122
            137
            138
            143
            165
            132
            141
            156
            153
            110
            131
            209
            195
            126
            81
          )

          if [ "${#SHARDS[@]}" -ne "${#TIMEOUTS[@]}" ]; then
            echo "::error::SHARDS (${#SHARDS[@]}) and TIMEOUTS (${#TIMEOUTS[@]}) must have the same length" >&2
            exit 1
          fi

          # A span split has two halves, "X{a..b}" in one shard and
          # "!X{a..b}" in another. A lone half drops (or tests twice) the
          # mutants of the other part of the file, so each span glob must
          # have its twin somewhere in SHARDS.
          SPAN_RE='\{[0-9]+\.\.[0-9]+\}$'
          ALL_GLOBS=()
          for entry in "${SHARDS[@]}"; do
            IFS=';' read -ra parts <<< "$entry"
            ALL_GLOBS+=("${parts[@]}")
          done
          for glob in "${ALL_GLOBS[@]}"; do
            if [[ $glob =~ $SPAN_RE ]]; then
              if [ "${glob:0:1}" = "!" ]; then
                twin="${glob:1}"
              else
                twin="!$glob"
              fi
              found=false
              for other in "${ALL_GLOBS[@]}"; do
                if [ "$other" = "$twin" ]; then
                  found=true
                  break
                fi
              done
              if [ "$found" != true ]; then
                echo "::error::SHARDS glob '$glob' has no twin '$twin'; a span split needs both halves (see the comment above SHARDS)." >&2
                exit 1
              fi
            fi
          done

          if [ -n "$CUSTOM_SCOPE" ]; then
            # Custom scope: reuse the paired timeout if the scope equals a
            # SHARDS entry; otherwise fall back to the largest configured
            # timeout so an arbitrary scope still gets a generous budget
            # instead of the job's implicit default.
            TIMEOUT=""
            for i in "${!SHARDS[@]}"; do
              if [ "${SHARDS[$i]}" = "$CUSTOM_SCOPE" ]; then
                TIMEOUT="${TIMEOUTS[$i]}"
                break
              fi
            done
            if [ -z "$TIMEOUT" ]; then
              TIMEOUT=0
              for t in "${TIMEOUTS[@]}"; do
                if [ "$t" -gt "$TIMEOUT" ]; then
                  TIMEOUT="$t"
                fi
              done
            fi
            MATRIX=$(jq -nc --arg scope "$CUSTOM_SCOPE" --argjson timeout "$TIMEOUT" \
              '[{idx: "custom", scope: $scope, timeout: $timeout}]')
            MODE="custom"
          elif [ "$FULL_MODE" = "true" ]; then
            # Mutates every file in one shard: always needs the largest
            # configured budget.
            MATRIX=$(jq -nc '[{idx: "full", scope: "**/*.cs", timeout: 340}]')
            MODE="full"
          elif [ "$DIFF_MODE" = "true" ]; then
            MATRIX=$(jq -nc '[{idx: "diff", scope: "**/*.cs", timeout: 340}]')
            MODE="diff"
          else
            # Default: emit every SHARDS entry as a matrix shard.
            ENTRIES=""
            for i in "${!SHARDS[@]}"; do
              ENTRY=$(jq -nc --arg idx "$i" --arg scope "${SHARDS[$i]}" --argjson timeout "${TIMEOUTS[$i]}" \
                '{idx: $idx, scope: $scope, timeout: $timeout}')
              if [ -z "$ENTRIES" ]; then
                ENTRIES="$ENTRY"
              else
                ENTRIES="$ENTRIES,$ENTRY"
              fi
            done
            MATRIX="[$ENTRIES]"
            MODE="matrix"
          fi

          COUNT=$(echo "$MATRIX" | jq 'length')
          {
            echo "matrix=$MATRIX"
            echo "mode=$MODE"
            echo "shard_count=$COUNT"
          } >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"
          echo "Shard count: $COUNT"
          echo "Matrix:"
          echo "$MATRIX" | jq .

  # Diagnostic baseline — runs once in parallel with the matrix instead of
  # once per shard. Stryker runs in project mode from tests/Encina.UnitTests
  # (#1441), so a failing test there breaks every shard's initial test run
  # (break-on-initial-test-failure); this job shows which test fails.
  test-baseline:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ env.DOTNET_SDK_VERSION }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ env.DOTNET_SDK_VERSION }}
            ${{ runner.os }}-nuget

      - name: Restore
        run: dotnet restore tests/Encina.UnitTests/Encina.UnitTests.csproj

      - name: Build
        run: dotnet build tests/Encina.UnitTests/Encina.UnitTests.csproj --configuration Debug --no-restore

      - name: Run the Stryker test project (diagnostic baseline)
        run: |
          mkdir -p artifacts/test-baseline
          echo "::group::Encina.UnitTests"
          dotnet test tests/Encina.UnitTests/Encina.UnitTests.csproj \
            --configuration Debug \
            --logger "trx;LogFileName=Encina.UnitTests.trx" \
            --results-directory artifacts/test-baseline \
            2>&1 | tee artifacts/test-baseline/Encina.UnitTests.log || true
          echo "::endgroup::"

      - name: Upload diagnostic baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-test-baseline
          path: artifacts/test-baseline
          if-no-files-found: ignore

  # Phase 2 — Run mutation tests per shard.
  #
  # With fail-fast: false, a single-shard failure does not abort the other
  # matrix entries. continue-on-error: true at the job level prevents any
  # shard failure from failing the overall workflow conclusion, so the
  # downstream publish-mutations workflow (which requires success) still
  # runs as long as the aggregate job succeeds.
  run-mutation-tests:
    permissions:
      contents: read
      # The "Run mutation tests" step publishes runner telemetry to a check
      # run that outlives a lost runner (#1441).
      checks: write
    needs: select-matrix
    runs-on: ubuntu-latest
    # Per-shard budget from the matrix, not one fixed value: see the
    # TIMEOUTS array in select-matrix and its sizing notes (#1395).
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ env.DOTNET_SDK_VERSION }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ env.DOTNET_SDK_VERSION }}
            ${{ runner.os }}-nuget

      - name: Cache dotnet tools
        uses: actions/cache@v6
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-dotnet-tools-${{ env.DOTNET_SDK_VERSION }}
          restore-keys: |
            ${{ runner.os }}-dotnet-tools-${{ env.DOTNET_SDK_VERSION }}
            ${{ runner.os }}-dotnet-tools

      # Stryker builds tests/Encina.UnitTests (Debug, the project's default
      # configuration) and runs only that project (project mode, #1441), so
      # the shard restores and builds that project alone; the build here is
      # an early failure gate and leaves Stryker an incremental build.
      - name: Restore
        run: dotnet restore tests/Encina.UnitTests/Encina.UnitTests.csproj

      - name: Build
        run: dotnet build tests/Encina.UnitTests/Encina.UnitTests.csproj --configuration Debug --no-restore

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Run mutation tests (shard ${{ matrix.idx }})
        id: stryker
        # Pass matrix fields + select-matrix outputs via env: rather than
        # ${{ }} template interpolation. matrix.scope carries the
        # user-controlled `custom_scope` input in custom mode — an
        # attacker-crafted value like `"; rm -rf / #` would otherwise
        # execute in the runner shell. Same script-injection hardening as
        # the "Build matrix" step above.
        #
        # Memory and CPU (#1441 phase 2). Calibration run 37130291929 lost
        # its runner about an hour into this step and left no log; memory
        # exhaustion of the 16 GB runner is the most likely cause.
        # - Stryker runs at concurrency 1, set in .github/stryker-config.json
        #   and not on the command line: run-stryker.cs reads -c as
        #   --configuration, and Stryker 5.0.0 under-reports kills with the
        #   MTP runner above concurrency 1 (stryker-net#3832). One slot keeps
        #   one test host alive for every mutant.
        # - DOTNET_GCHeapHardLimit (hexadecimal bytes) caps the managed heap
        #   of every .NET process of the step at 4 GiB, so a test host that
        #   runs out throws OutOfMemoryException instead of growing until
        #   the kernel stalls the VM. Measured locally on 2026-10-03 with
        #   one fresh process (Encina.UnitTests, 22,233 tests, 4 threads
        #   like the runner's 4 vCPU): 2 GiB fails with
        #   OutOfMemoryException, 3 GiB passes about 30 % slower, 4 GiB
        #   passes at full speed. A full rebuild of Encina.UnitTests also
        #   passes under the cap (MSBuild peak 1.3 GiB), so the cap does not
        #   need to be scoped to the test host.
        #   HYPOTHESIS, checked by the phase-2 calibration runs: Stryker
        #   reuses one test host for every mutant and its heap growth across
        #   runs is not measured. An OutOfMemoryException inside a mutant run
        #   fails some test, which Stryker may count as a kill. The step
        #   "Fail a shard whose run ran out of memory" catches what reaches
        #   Stryker's console; the calibration compares the Killed count of
        #   a shard with a local concurrency-1 run of the same scope.
        # - The shell raises its own OOM score before starting Stryker and
        #   runs it under nice, so under memory or CPU pressure the kernel
        #   sacrifices Stryker or a test host, never the runner agent, and
        #   the agent keeps its heartbeat. No swap is added: swapping is what
        #   starves the agent; swapon --show is recorded instead.
        # - Hard memory cap (phase 2b). Validation run 37150985477 lost its
        #   runner although the heap cap above was set: from 20:35Z one
        #   process whose comm is "dotnet" grew about 4 GB a minute to
        #   14.5 GB RSS, the VM went to 122 MB available and 3 GB of swap,
        #   telemetry stopped at 20:40Z and the runner was lost at 21:25Z.
        #   The OOM score did not save the agent: the kernel swapped instead
        #   of killing. So Stryker and everything it starts now run in a
        #   cgroup v2 of their own, memory.max STRYKER_MEMORY_MAX (12 GiB of
        #   the runner's 16 GB, about 3.5 GB left for the agent, the
        #   monitor and the kernel), memory.swap.max 0 (no thrashing inside
        #   the cap) and memory.oom.group 1 (the kernel kills the whole
        #   tree at once, so Stryker cannot restart a killed test host and
        #   count the crash as a kill). The step then fails with the
        #   cgroup's OOM count and the processes of the last reading.
        #   A cgroup the step creates under /sys/fs/cgroup with sudo, not
        #   `systemd-run --user --scope`: the runner agent runs as a system
        #   service, which normally has no user manager or session bus to
        #   connect to (unverified; the step logs whether `systemctl --user`
        #   answers), it needs the memory controller delegated to that
        #   manager, and a transient scope
        #   is removed with its last process, together with the
        #   memory.events that prove the kill; this cgroup stays readable
        #   after it.
        env:
          MATRIX_IDX: ${{ matrix.idx }}
          MATRIX_SCOPE: ${{ matrix.scope }}
          SELECT_MODE: ${{ needs.select-matrix.outputs.mode }}
          SHARD_COUNT: ${{ needs.select-matrix.outputs.shard_count }}
          # Not GH_TOKEN: the token (checks: write) is moved into a shell
          # variable and unset below, so Stryker, its builds and the test
          # hosts running mutated code never see it; only the gh calls get it.
          TELEMETRY_TOKEN: ${{ github.token }}
          DOTNET_GCHeapHardLimit: "0x100000000"
          # Run 37285914861 (#1441 phase 2c): the MTP test server
          # (Encina.UnitTests.dll --server) had the 4 GiB limit above in its
          # environment, yet reached 8.8 GB of anonymous memory and was killed
          # at 11.05 GB by the cap below, so the managed-heap limit alone does
          # not bound it. Workstation, non-concurrent GC is forced so no
          # per-core server heaps or background GC threads are added on the
          # 4-vCPU runner (the hard limit stays; HeapHardLimitPercent would
          # be ignored next to it). Whether the server still grows is read
          # from the gc_server and anon columns of the process telemetry.
          DOTNET_gcServer: "0"
          DOTNET_gcConcurrent: "0"
          # #1441 phase 2e: glibc's dynamic mmap threshold kept the native
          # memory freed after each run of the ABAC EEL tests (Roslyn script
          # compilations), so the reused MTP test server grew about 2.5 GB per
          # run and was killed in run 4. Fixed thresholds return freed blocks
          # to the kernel: measured on Linux with a 12 GiB cap, the first-run
          # peak dropped from 7.6 GB to 4.9 GB and growth to about 230 MB per
          # run, with no slowdown. MALLOC_ARENA_MAX=2 did not help. The
          # remaining growth is fixed in the tests by #1858.
          MALLOC_MMAP_THRESHOLD_: "131072"
          MALLOC_TRIM_THRESHOLD_: "131072"
          # #1441 phase 2f: the Encina.UnitTests test server ends itself at
          # the start of a mutant's session when its private memory is above
          # ENCINA_MTP_RECYCLE_MB, and Stryker retries that mutant on a fresh
          # server (tests/Encina.UnitTests/TestHost/StrykerServerRecycler.cs).
          # Stryker discards the server's stderr, so each recycle is also
          # appended to ENCINA_MTP_RECYCLE_LOG, which is uploaded with the
          # stryker-logs artifact and counted in the shard summary.
          ENCINA_MTP_RECYCLE_MB: "6144"
          ENCINA_MTP_RECYCLE_LOG: ${{ github.workspace }}/artifacts/mutation/logs/mtp-recycle.log
          # Stryker's verbosity: a custom-scope dispatch (a diagnostic run)
          # logs at debug level so the log names the mutant under test when
          # a test host starts to grow; scheduled and full-matrix runs stay
          # at info (debug logs of 150-mutant shards are large).
          STRYKER_VERBOSITY: ${{ (github.event_name == 'workflow_dispatch' && inputs.custom_scope != '') && 'debug' || 'info' }}
          # 12 GiB in bytes, for the cgroup's memory.max (see above).
          STRYKER_MEMORY_MAX: "12884901888"
        run: |
          # pipefail: Stryker's output goes through tee below, and without it
          # the step would report tee's exit code and a failing Stryker run
          # would look green.
          set -o pipefail
          TOKEN="$TELEMETRY_TOKEN"
          unset TELEMETRY_TOKEN
          LOGS=artifacts/mutation/logs
          mkdir -p "$LOGS"
          CONSOLE_LOG="$LOGS/stryker-console.log"
          HISTORY="$LOGS/runner-resources-history.log"
          : > "$CONSOLE_LOG"
          : > "$HISTORY"
          SCOPE="$MATRIX_SCOPE"
          MODE="$SELECT_MODE"

          echo "Shard idx: $MATRIX_IDX"
          echo "Scope: $SCOPE"
          echo "Mode: $MODE"
          echo "Swap:"
          swapon --show || true

          # The Build step left a compiler server (VBCSCompiler, about 3 GB
          # in run 37150985477) and build nodes running outside the memory
          # cap; Stryker's builds would reuse them. Stop them so Stryker
          # starts its own, inside the cap.
          dotnet build-server shutdown > /dev/null 2>&1 || true

          # Hard memory cap: a cgroup v2 for Stryker and everything it starts
          # (see the step comment). Without it a runaway process swaps the
          # VM until the runner is lost and no log survives, so a shard that
          # cannot set it up fails here instead of running uncapped.
          echo "systemctl --user: $(systemctl --user is-system-running 2>&1 | head -n 1)"
          CG=/sys/fs/cgroup/encina-stryker-$GITHUB_RUN_ID-$MATRIX_IDX
          setup_memory_cap() {
            [ -f /sys/fs/cgroup/cgroup.controllers ] || { echo "cgroup v2 is not mounted at /sys/fs/cgroup"; return 1; }
            if ! grep -qw memory /sys/fs/cgroup/cgroup.subtree_control; then
              echo +memory | sudo -n tee /sys/fs/cgroup/cgroup.subtree_control > /dev/null || return 1
            fi
            sudo -n mkdir -p "$CG" || return 1
            echo "$STRYKER_MEMORY_MAX" | sudo -n tee "$CG/memory.max" > /dev/null || return 1
            # Without these two the cap still bounds the RAM the tree takes
            # from the agent, and an OOM kill still fails the step at the
            # end, so they only warn.
            echo 0 | sudo -n tee "$CG/memory.swap.max" > /dev/null \
              || echo "::warning::memory.swap.max not set; the processes under the cap may swap."
            echo 1 | sudo -n tee "$CG/memory.oom.group" > /dev/null \
              || echo "::warning::memory.oom.group not set; an OOM kill under the cap may take one process instead of the whole tree."
            [ "$(cat "$CG/memory.max")" = "$STRYKER_MEMORY_MAX" ] || { echo "memory.max reads $(cat "$CG/memory.max")"; return 1; }
          }
          if ! setup_memory_cap; then
            echo "::error title=No memory cap::Shard $MATRIX_IDX could not create the cgroup $CG with memory.max $STRYKER_MEMORY_MAX; Stryker does not run uncapped (#1441)."
            exit 1
          fi
          echo "Memory cap: $CG memory.max=$(cat "$CG/memory.max") memory.swap.max=$(cat "$CG/memory.swap.max" 2>&1) memory.oom.group=$(cat "$CG/memory.oom.group" 2>&1)"

          # Telemetry that survives a lost runner (#1441, #1682). GitHub
          # keeps no log of a job whose runner is lost, not even of its
          # finished steps, so the monitor below also publishes its readings
          # to a check run, "mutation telemetry (shard N)", on this commit:
          # the last update before a loss stays on GitHub. The step "Complete
          # mutation telemetry" closes it, and the aggregate job closes the
          # ones a lost runner left open. Every gh call tolerates failure and
          # gives up after 30 s, so telemetry never fails or stalls the shard.
          CHECK_ID=$(GH_TOKEN="$TOKEN" timeout 30 gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="mutation telemetry (shard $MATRIX_IDX)" \
            -f head_sha="$GITHUB_SHA" \
            -f status=in_progress \
            -f external_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$MATRIX_IDX" \
            -f "output[title]=Shard $MATRIX_IDX: starting" \
            -f "output[summary]=Run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT, mode $MODE." \
            --jq .id 2>/dev/null) || CHECK_ID=""
          echo "check_id=$CHECK_ID" >> "$GITHUB_OUTPUT"
          if [ -z "$CHECK_ID" ]; then
            echo "::warning::Could not create the telemetry check run; readings go to the step log and the logs artifact only."
          fi

          # The GITHUB_TOKEN allows 1,000 REST requests per hour per
          # repository, shared by every shard of the run, and GitHub's
          # secondary limit for content-creating requests is lower (500 per
          # hour, documented). The check run is updated every PUBLISH_EVERY
          # minutes so the whole matrix stays at or below about 360 updates
          # per hour: every minute up to 6 shards, every two minutes up to
          # 12, every four minutes for 20, and so on. Readings are still
          # taken every minute.
          PUBLISH_EVERY=$(( (${SHARD_COUNT:-1} + 5) / 6 ))
          if [ "$PUBLISH_EVERY" -lt 1 ]; then
            PUBLISH_EVERY=1
          fi

          # Every process over 200 MB of RSS, largest first (phase 2b: run
          # 37150985477 showed only "top=dotnet", which could not tell
          # Stryker from a test host). One line each: pid, ppid, RSS; for a
          # .NET process (libcoreclr.so mapped) whether
          # DOTNET_GCHeapHardLimit is in the environment it started with
          # (/proc/<pid>/environ) and how its RSS splits into anonymous
          # memory (GC heap and native allocations together), file mappings
          # and swap (/proc/<pid>/smaps_rollup); then its command line. The
          # GC heap size itself is not read: dotnet-counters would have to
          # be installed and would attach one more .NET process every minute
          # to a VM that is short of memory.
          processes() {
            local pid ppid rss args kind gclimit gcserver split
            echo "processes over 200 MB (MB; gc_limit = DOTNET_GCHeapHardLimit at process start):"
            ps -eo pid=,ppid=,rss=,args= --sort=-rss | while read -r pid ppid rss args; do
              [ "$rss" -gt 204800 ] || break
              kind=native
              gclimit=-
              if grep -qs libcoreclr.so "/proc/$pid/maps"; then
                kind=dotnet
                if [ -r "/proc/$pid/environ" ]; then
                  gclimit=$(tr '\0' '\n' < "/proc/$pid/environ" | sed -n 's/^DOTNET_GCHeapHardLimit=//p')
                  gclimit=${gclimit:-absent}
                  gcserver=$(tr '\0' '\n' < "/proc/$pid/environ" | sed -n 's/^DOTNET_gcServer=//p')
                  gclimit="$gclimit gc_server=${gcserver:-absent}"
                else
                  gclimit=unreadable
                fi
              fi
              split=$(awk '/^Rss:/ {r = $2} /^Anonymous:/ {a = $2} /^Swap:/ {s = $2} END {printf "anon=%d file=%d swap=%d", a / 1024, (r - a) / 1024, s / 1024}' "/proc/$pid/smaps_rollup" 2>/dev/null)
              echo "pid=$pid ppid=$ppid rss=$((rss / 1024)) $kind gc_limit=$gclimit ${split:-anon=? file=? swap=?} args=${args:0:400}"
            done
          }

          # The memory cap's cgroup: current and peak usage, OOM kills, and
          # how many processes it holds.
          cgroup_state() {
            local current peak kills procs
            current=$(( $(cat "$CG/memory.current" 2>/dev/null || echo 0) / 1048576 ))
            peak=$(( $(cat "$CG/memory.peak" 2>/dev/null || echo 0) / 1048576 ))
            kills=$(awk '$1 == "oom_kill" {print $2}' "$CG/memory.events" 2>/dev/null)
            procs=$(wc -l 2>/dev/null < "$CG/cgroup.procs")
            echo "cg_mem=${current}MB cg_peak=${peak}MB cg_oom_kill=${kills:-?} cg_procs=${procs:-?}"
          }

          # One reading: a full sample (appended to runner-resources.log and
          # kept in runner-resources-latest.log), the process lines alone in
          # runner-processes-latest.log, and one compact line in
          # runner-resources-history.log.
          sample() {
            local now l1 l5 l15 mem top
            now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            # Written aside and renamed, so a reader never sees half a file.
            processes > "$LOGS/runner-processes-latest.log.tmp" 2>&1
            mv -f "$LOGS/runner-processes-latest.log.tmp" "$LOGS/runner-processes-latest.log"
            {
              echo "== $now"
              echo "loadavg: $(cat /proc/loadavg)"
              free -m
              echo "swap:"
              swapon --show
              df -h / /mnt
              echo "memory cap: $(cgroup_state)"
              cat "$LOGS/runner-processes-latest.log"
              echo "dotnet processes: $(pgrep -c dotnet), processes whose command line names Encina.UnitTests (test hosts, builds): $(pgrep -c -f Encina.UnitTests)"
              echo "kernel OOM lines:"
              sudo -n dmesg -T 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -n 3
              echo "stryker console (last 400 bytes):"
              tail -c 400 "$CONSOLE_LOG" | tr '\r' '\n' | sed 's/\x1b\[[0-9;]*[A-Za-z]//g'
              echo
            } > "$LOGS/runner-resources-latest.log" 2>&1
            cat "$LOGS/runner-resources-latest.log" >> "$LOGS/runner-resources.log"
            read -r l1 l5 l15 _ < /proc/loadavg
            mem=$(free -m | awk '/^Mem:/ {printf "mem_used=%sMB mem_avail=%sMB", $3, $7} /^Swap:/ {printf " swap_used=%sMB", $3}')
            top=$(ps -eo pid=,rss=,comm= --sort=-rss | awk 'NR == 1 {printf "top=%s/%s:%dMB", $1, $3, $2 / 1024}')
            # The largest process and the cap come first: the check run's
            # title shows the first 180 characters of the newest line.
            echo "$now $top $(cgroup_state) $mem load=$l1/$l5/$l15 dotnet=$(pgrep -c dotnet) encina_unittests=$(pgrep -c -f Encina.UnitTests)" >> "$HISTORY"
          }

          # Push the compact lines and the latest process lines (summary)
          # and the latest full sample (text) to the check run. The process
          # lines go in the summary because the text field of run
          # 37150985477's check run came back empty although every update
          # sent one. Both are reduced to printable ASCII (a cut multi-byte
          # character or a control byte from the console tail must not spoil
          # the request) and the summary stays under GitHub's 65,535
          # characters: 45 history lines of about 260 and the process lines.
          publish() {
            if [ -z "$CHECK_ID" ]; then
              return 0
            fi
            {
              echo "Run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT, shard $MATRIX_IDX. One line per minute, newest last:"
              echo '```text'
              tail -n 45 "$HISTORY"
              echo '```'
              echo 'Latest reading, processes over 200 MB:'
              echo '```text'
              head -c 20000 "$LOGS/runner-processes-latest.log"
              echo '```'
            } | LC_ALL=C tr -cd '\11\12\40-\176' > "$LOGS/check-summary.md"
            {
              echo 'Latest full sample:'
              echo '```text'
              head -c 40000 "$LOGS/runner-resources-latest.log"
              echo '```'
            } | LC_ALL=C tr -cd '\11\12\40-\176' > "$LOGS/check-text.md"
            GH_TOKEN="$TOKEN" timeout 30 gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_ID" \
              -f "output[title]=Shard $MATRIX_IDX: $(tail -n 1 "$HISTORY" | cut -c 1-180)" \
              -F "output[summary]=@$LOGS/check-summary.md" \
              -F "output[text]=@$LOGS/check-text.md" > /dev/null 2>&1
          }

          # Monitor, once a minute (#1682: a shard lost its hosted runner
          # without leaving a log). The full readings are uploaded with the
          # Stryker logs when the job ends, even on failure or cancellation;
          # every fifth reading also goes to the step log, and the check run
          # gets one every PUBLISH_EVERY minutes. errexit and pipefail are
          # off inside the loop so a failing probe (no sudo, no match) never
          # stops it. The EXIT trap stops the loop, so the step still ends
          # with Stryker.
          (
            set +e +o pipefail
            minute=0
            while true; do
              sample
              if [ $((minute % PUBLISH_EVERY)) -eq 0 ]; then
                publish
              fi
              if [ $((minute % 5)) -eq 0 ]; then
                echo "[runner-resources] $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                free -m
                df -h /
                tail -n 1 "$HISTORY"
              fi
              minute=$((minute + 1))
              sleep 60
            done
          ) < /dev/null 2>&1 &
          MONITOR_PID=$!
          trap 'kill "$MONITOR_PID" 2>/dev/null || true' EXIT

          # From here on this shell and everything it starts (Stryker, its
          # builds and the test hosts) carry the highest OOM score, so the
          # kernel kills them before the runner agent. Raising one's own
          # score needs no root, and children inherit it. The monitor above
          # keeps the default score.
          # A failed write only loses this protection; it does not fail the
          # shard.
          echo 1000 > /proc/self/oom_score_adj || echo "::warning::Could not raise oom_score_adj; the runner agent is not protected from the OOM killer."
          echo "oom_score_adj: $(cat /proc/self/oom_score_adj)"

          # The subshell moves itself into the memory cap's cgroup (root
          # writes the pid: moving a process needs write access to the
          # cgroup.procs of the common ancestor, the root cgroup) and then
          # becomes Stryker, so Stryker and every process it starts are
          # capped. tee stays outside: when the cap kills the tree, the
          # console log is still complete. A failed move fails the shard
          # (exit 90) rather than running uncapped.
          run_stryker() {
            (
              # $BASHPID is read here, before the pipeline: the left side of
              # a pipeline runs in a forked child with its own $BASHPID.
              self=$BASHPID
              if ! { echo "$self" | sudo -n tee "$CG/cgroup.procs" > /dev/null && grep -qx "$self" "$CG/cgroup.procs"; }; then
                echo "::error title=No memory cap::Could not move the Stryker process ($self) into $CG."
                exit 90
              fi
              exec nice -n 10 dotnet run --file .github/scripts/run-stryker.cs -- "$@"
            ) 2>&1 | tee -a "$CONSOLE_LOG"
          }

          # Fails the step with the evidence when an OOM kill happened under
          # the cap: the kill count and peak of the cgroup, the kernel's own
          # OOM lines (they name the process it chose, exactly), and the
          # processes of the last reading before the kill (taken at most a
          # minute earlier; in run 37150985477 the runaway grew about 4 GB a
          # minute, so it is already the largest there).
          report_memory_cap() {
            local status=$1 kills peak largest kernel
            kills=$(awk '$1 == "oom_kill" {print $2}' "$CG/memory.events" 2>/dev/null)
            peak=$(( $(cat "$CG/memory.peak" 2>/dev/null || echo 0) / 1048576 ))
            echo "Stryker exit status: $status; memory cap: oom_kill=${kills:-?} peak=${peak}MB of $((STRYKER_MEMORY_MAX / 1048576))MB"
            if [ "${kills:-0}" -gt 0 ]; then
              largest=$(head -n 2 "$LOGS/runner-processes-latest.log" | tail -n 1 | cut -c 1-600)
              kernel=$(sudo -n dmesg -T 2>/dev/null | grep -iE 'memory cgroup out of memory|killed process' | tail -n 5)
              # memory-cap.txt also goes to the telemetry check run (step
              # "Complete mutation telemetry") and makes the step "Fail a
              # shard whose run ran out of memory" withhold the report.
              {
                echo "Memory cap: an OOM kill occurred under the cap (peak ${peak} MB, $kills OOM kill(s)). Largest process at the last reading: $largest"
                echo "Kernel OOM lines:"
                echo "$kernel"
              } > "$LOGS/memory-cap.txt"
              echo "::error title=Memory cap reached::Shard $MATRIX_IDX: an OOM kill occurred under the $((STRYKER_MEMORY_MAX / 1073741824)) GiB cap (peak ${peak} MB, $kills OOM kill(s)). Kernel: $(echo "$kernel" | tail -n 1 | cut -c 1-300). Largest process at the last reading: $largest"
              echo "Kernel OOM lines:"
              echo "$kernel"
              echo "Processes over 200 MB at the last reading before the kill:"
              cat "$LOGS/runner-processes-latest.log"
              echo "Readings of the last 10 minutes:"
              tail -n 10 "$HISTORY"
              return 1
            fi
          }

          # Build --mutate args: every ';'-separated glob of the shard scope,
          # then the standard exclusions.
          #
          # Stored as a bash array (not a space-joined string) so every
          # element is passed as a single argv entry when expanded via
          # "${MUTATE_ARGS[@]}". The scope value comes from workflow_dispatch
          # input `custom_scope` in custom mode, so an unquoted expansion
          # would be a command-injection surface — word-splitting could let
          # crafted whitespace in the scope spill into neighbouring args,
          # and glob expansion could substitute matching filenames from the
          # runner working tree.
          #
          # There is no test-case-filter: the MTP runner ignores it
          # (stryker-net#3757), so every mutant runs the whole
          # Encina.UnitTests project and shards are sized by mutant count.
          IFS=';' read -ra SCOPE_GLOBS <<< "$SCOPE"
          MUTATE_ARGS=()
          INCLUDES=0
          for glob in "${SCOPE_GLOBS[@]}"; do
            if [ -z "$glob" ]; then
              continue
            fi
            MUTATE_ARGS+=("--mutate:$glob")
            if [ "${glob:0:1}" != "!" ]; then
              INCLUDES=$((INCLUDES + 1))
            fi
          done
          if [ "$INCLUDES" -eq 0 ]; then
            echo "::error::Shard scope '$SCOPE' has no include glob (only empty or '!' entries)."
            exit 1
          fi
          for excl in '!**/Log.cs' '!**/LogMessages.cs' '!**/Diagnostics/*ActivitySource.cs' '!**/Diagnostics/*Metrics.cs' '!**/*Errors.cs' '!**/*Constants.cs'; do
            MUTATE_ARGS+=("--mutate:$excl")
          done

          # Always expand MUTATE_ARGS via "${MUTATE_ARGS[@]}" (quoted) so
          # each array element becomes exactly one argv entry — no word
          # splitting, no glob expansion.
          #
          # run_stryker sends Stryker's console to the step log and to
          # stryker-console.log, which is uploaded with the logs artifact and
          # whose tail feeds the telemetry check run. Its status is kept
          # (|| under bash -e) so the memory cap can be reported before the
          # step fails with it.
          STRYKER_STATUS=0
          if [ "$MODE" = "diff" ]; then
            echo "Running diff mode (vs main)"
            run_stryker --since:main "${MUTATE_ARGS[@]}" || STRYKER_STATUS=$?
          elif [ "$MODE" = "full" ]; then
            echo "Running full mode (all files — will exceed the 340-min shard timeout)"
            # Pass MUTATE_ARGS so the CLI exclusion list stays the single
            # source of truth; otherwise full_mode would silently drift if
            # MUTATE_ARGS gains an exclusion the config file does not have.
            run_stryker "${MUTATE_ARGS[@]}" || STRYKER_STATUS=$?
          else
            echo "Running shard scope: $SCOPE"
            run_stryker "${MUTATE_ARGS[@]}" || STRYKER_STATUS=$?
          fi
          # An OOM kill under the cap fails the step even if the exit status
          # somehow came back 0.
          report_memory_cap "$STRYKER_STATUS" || [ "$STRYKER_STATUS" -ne 0 ] || STRYKER_STATUS=1
          exit "$STRYKER_STATUS"

      - name: Locate mutation report
        id: stryker-report
        if: always()
        env:
          MATRIX_IDX: ${{ matrix.idx }}
        run: |
          # Stryker writes the report to one of:
          #   - artifacts/mutation/reports/mutation-report.json (direct)
          #   - artifacts/mutation/<timestamp>/reports/mutation-report.json
          #     (when it adds a timestamp subdirectory)
          # artifacts/mutation/logs/ also exists (the runner-resources log,
          # and Stryker's own logs when `--log-to-file` is passed) — that
          # directory sorts lexicographically AFTER numeric timestamps, so a
          # naive "newest subdirectory under artifacts/mutation" lookup picks
          # `logs/` and silently misses the real report (reported by
          # Copilot on #1030).
          #
          # Search directly for any mutation-report.json under a
          # `reports/` subdirectory anywhere beneath artifacts/mutation.
          # `-printf '%T@ %p\n'` + `sort -rn` picks the newest by mtime
          # so timestamped runs are unambiguous; paths with spaces are
          # handled because cut -f2- keeps everything after the epoch.
          # GNU find is available on ubuntu-latest.
          report=$(find artifacts/mutation -type f -name "mutation-report.json" -path "*/reports/*" -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -n 1 | cut -d' ' -f2-)
          if [ -n "$report" ]; then
            reports_dir=$(dirname "$report")
            # The shard's identity travels inside its artifact: the aggregate
            # job reads shard-id.txt next to each report, because
            # actions/download-artifact extracts a lone matching artifact
            # straight into its path, without the artifact-name directory
            # (.github/scripts/mutation-shard-reports.cs).
            printf '%s\n' "$MATRIX_IDX" > "$reports_dir/shard-id.txt"
            echo "reports-dir=$reports_dir" >> "$GITHUB_OUTPUT"
            echo "summary-file=$reports_dir/mutation-report.txt" >> "$GITHUB_OUTPUT"
          fi

      # The report steps run even when the Stryker step failed (#1682): a
      # report that Stryker wrote before failing is still uploaded, and the
      # aggregate job decides what to do with it.
      - name: Publish shard text summary
        if: always() && steps.stryker-report.outputs.summary-file != ''
        # matrix.scope carries user input in custom mode; the value only
        # reaches the job summary (no shell execution), but passing via
        # env: keeps the hardening consistent and prevents a future edit
        # from accidentally evaluating it.
        env:
          MATRIX_IDX: ${{ matrix.idx }}
          MATRIX_SCOPE: ${{ matrix.scope }}
          SUMMARY_FILE: ${{ steps.stryker-report.outputs.summary-file }}
        run: |
          if [ -f "$SUMMARY_FILE" ]; then
            {
              echo "### Mutation Report — Shard ${MATRIX_IDX} (\`${MATRIX_SCOPE}\`)";
              echo '```';
              cat "$SUMMARY_FILE";
              echo '```';
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # #1441 phase 2f: number of test-server recycles in this shard.
          RECYCLE_LOG=artifacts/mutation/logs/mtp-recycle.log
          RECYCLES=0
          if [ -f "$RECYCLE_LOG" ]; then RECYCLES=$(grep -c . "$RECYCLE_LOG" || true); fi
          echo "Test-server recycles (ENCINA_MTP_RECYCLE_MB): ${RECYCLES}" >> "$GITHUB_STEP_SUMMARY"

      # The 4 GiB heap cap of "Run mutation tests" turns a runaway test host
      # into an OutOfMemoryException, and a test that fails with it inside a
      # mutant run may be counted as a kill. When Stryker's console shows
      # one, the shard fails and its report is not uploaded, so its files
      # keep their previous dashboard data instead of a skewed score. Only
      # what reaches the console is seen; the phase-2 calibration compares
      # Killed counts with a local run to check the rest (#1441).
      # An OOM kill under the memory cap (memory-cap.txt) withholds the
      # report too: if memory.oom.group could not be set, the kernel may
      # kill one test host, Stryker restarts it, and the crash may count as
      # a kill.
      - name: Fail a shard whose run ran out of memory
        id: oom-guard
        if: always() && steps.stryker.outcome != 'skipped'
        env:
          MATRIX_IDX: ${{ matrix.idx }}
        run: |
          CAP_FILE=artifacts/mutation/logs/memory-cap.txt
          if [ -f "$CAP_FILE" ]; then
            echo "oom=true" >> "$GITHUB_OUTPUT"
            echo "::error title=Out of memory::Shard $MATRIX_IDX: an OOM kill occurred under the memory cap; the report is not uploaded because kills may be inflated (#1441)."
            cat "$CAP_FILE"
            exit 1
          fi
          CONSOLE_LOG=artifacts/mutation/logs/stryker-console.log
          if [ -f "$CONSOLE_LOG" ] && grep -q 'OutOfMemoryException' "$CONSOLE_LOG"; then
            echo "oom=true" >> "$GITHUB_OUTPUT"
            echo "::error title=Out of memory::Shard $MATRIX_IDX: Stryker's console reports an OutOfMemoryException; the report is not uploaded because kills may be inflated (#1441)."
            grep -n -m 5 'OutOfMemoryException' "$CONSOLE_LOG"
            exit 1
          fi

      - name: Upload shard mutation report
        if: always() && steps.stryker-report.outputs.reports-dir != '' && steps.oom-guard.outputs.oom != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-shard-${{ matrix.idx }}
          path: ${{ steps.stryker-report.outputs.reports-dir }}
          if-no-files-found: error

      - name: Upload Stryker logs (shard ${{ matrix.idx }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-logs-shard-${{ matrix.idx }}
          path: artifacts/mutation/logs
          if-no-files-found: ignore

      # Closes the telemetry check run of "Run mutation tests" with the
      # conclusion neutral: it records readings, not a verdict. A lost runner
      # never gets here; the aggregate job closes those check runs.
      - name: Complete mutation telemetry (shard ${{ matrix.idx }})
        if: always() && steps.stryker.outputs.check_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ID: ${{ steps.stryker.outputs.check_id }}
          MATRIX_IDX: ${{ matrix.idx }}
          STRYKER_OUTCOME: ${{ steps.stryker.outcome }}
        run: |
          LOGS=artifacts/mutation/logs
          # Same layout as the step's publish(): history and process lines
          # in the summary, the full sample in the text, printable ASCII.
          TITLE="Shard $MATRIX_IDX: Stryker step $STRYKER_OUTCOME"
          if [ -f "$LOGS/memory-cap.txt" ]; then
            TITLE="$TITLE, memory cap reached"
          fi
          {
            echo "Stryker step outcome: $STRYKER_OUTCOME."
            cat "$LOGS/memory-cap.txt" 2>/dev/null || true
            echo "One line per minute, newest last:"
            echo '```text'
            tail -n 45 "$LOGS/runner-resources-history.log" 2>/dev/null || true
            echo '```'
            echo 'Last reading, processes over 200 MB:'
            echo '```text'
            head -c 20000 "$LOGS/runner-processes-latest.log" 2>/dev/null || true
            echo '```'
          } | LC_ALL=C tr -cd '\11\12\40-\176' > "$RUNNER_TEMP/check-summary.md"
          {
            echo 'Latest full sample:'
            echo '```text'
            head -c 40000 "$LOGS/runner-resources-latest.log" 2>/dev/null || true
            echo '```'
          } | LC_ALL=C tr -cd '\11\12\40-\176' > "$RUNNER_TEMP/check-text.md"
          timeout 30 gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_ID" \
            -f status=completed \
            -f conclusion=neutral \
            -f "output[title]=$TITLE" \
            -F "output[summary]=@$RUNNER_TEMP/check-summary.md" \
            -F "output[text]=@$RUNNER_TEMP/check-text.md" > /dev/null \
            || echo "::warning::Could not complete the telemetry check run $CHECK_ID."

      # #1440: the VsTest runner reported 0 killed on every shard for weeks
      # and every job stayed green. A report that tested mutants and killed
      # none means the runner did not activate the mutants, so the shard
      # fails; the aggregate job also refuses to publish such a report.
      # Only the default matrix is guarded: a custom or diff scope can test
      # a handful of mutants that all legitimately survive.
      - name: Fail a shard that killed no mutant
        if: always() && steps.stryker-report.outputs.reports-dir != '' && needs.select-matrix.outputs.mode == 'matrix'
        env:
          MATRIX_IDX: ${{ matrix.idx }}
          REPORTS_DIR: ${{ steps.stryker-report.outputs.reports-dir }}
        run: |
          REPORT="$REPORTS_DIR/mutation-report.json"
          TESTED=$(jq '[.files[] | (.mutants // [])[] | select(.status == "Killed" or .status == "Survived" or .status == "Timeout")] | length' "$REPORT")
          KILLED=$(jq '[.files[] | (.mutants // [])[] | select(.status == "Killed")] | length' "$REPORT")
          echo "Shard $MATRIX_IDX: $TESTED tested mutants (Killed, Survived or Timeout), $KILLED killed"
          if [ "$TESTED" -gt 0 ] && [ "$KILLED" -eq 0 ]; then
            echo "::error title=No mutant killed::Shard $MATRIX_IDX tested $TESTED mutants and killed none; the test runner did not activate the mutants (#1440)"
            exit 1
          fi

  # Phase 3 — Aggregate shard reports into a single mutation-report artifact.
  #
  # publish-mutations.yml downloads an artifact named `mutation-report` and
  # runs mutation-history.cs on it. This job produces that artifact by
  # merging the `files` maps from every successful shard's report.
  #
  # if: always() so aggregate still runs if some shards failed. A downstream
  # check guards against the 0-shards-succeeded case.
  aggregate:
    permissions:
      contents: read
      # Closes the telemetry check runs that lost runners left open.
      checks: write
    needs: [select-matrix, run-mutation-tests]
    if: always() && needs.select-matrix.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A shard whose runner was lost never runs its "Complete mutation
      # telemetry" step, so its check run would stay in progress on the
      # commit. Every shard has finished by now: complete the ones of this
      # run (external_id "<run id>-<attempt>-<shard>") that are still open.
      # Only status and conclusion change; the last readings the shard
      # published stay in the check run's output. Failure-tolerant, like
      # all telemetry.
      - name: Close telemetry check runs left open
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(timeout 60 gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?status=in_progress&per_page=100" \
            --jq ".check_runs[] | select((.external_id // \"\") | startswith(\"$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-\")) | .id" 2>/dev/null) || OPEN=""
          for id in $OPEN; do
            echo "Telemetry check run $id is still in progress (lost runner or cancelled job); completing it."
            timeout 30 gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$id" \
              -f status=completed -f conclusion=neutral > /dev/null \
              || echo "::warning::Could not complete the telemetry check run $id."
          done

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Download shard reports
        # actions/download-artifact@v8 fails the step when a `pattern:` matches
        # no artifacts. Swallow that failure so the merge step below owns the
        # 0-shards case and emits a clearer "no reports found" error.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: mutation-report-shard-*
          path: shards

      - name: Merge shard reports
        id: merge
        # SHARD_COUNT is derived from jq 'length' over a JSON built with
        # --arg, so it's always a number — but pass it via env: for
        # consistency with the rest of the workflow's injection hardening.
        # MATRIX_JSON carries the custom_scope input in custom mode; it is
        # only read by jq here, never evaluated by the shell.
        env:
          SHARD_COUNT: ${{ needs.select-matrix.outputs.shard_count }}
          MATRIX_JSON: ${{ needs.select-matrix.outputs.matrix }}
          SELECT_MODE: ${{ needs.select-matrix.outputs.mode }}
        run: |
          mkdir -p artifacts/mutation/reports shards

          # A shard that lost its runner, timed out before Stryker wrote the
          # report, or failed earlier uploads nothing (#1682). The merge
          # goes on with the other shards, and the missing ones are named in
          # a warning and in the step summary so the run is not taken for a
          # complete one. Each report is identified by the shard-id.txt its
          # shard wrote next to it, not by its directory: download-artifact
          # extracts a lone matching artifact straight into shards/, which
          # made the custom shard look missing (run 37149399906). The script
          # fails on a report it cannot attribute to exactly one matrix
          # shard; its --self-test covers both download layouts and runs
          # first, so a broken attribution fails here instead of misnaming
          # shards.
          dotnet run --file .github/scripts/mutation-shard-reports.cs -- --self-test
          dotnet run --file .github/scripts/mutation-shard-reports.cs -- \
            --shards shards \
            --matrix "$MATRIX_JSON" \
            --reports-out "$RUNNER_TEMP/shard-reports.txt" \
            --missing-out "$RUNNER_TEMP/missing-shards.txt"
          mapfile -t REPORTS < "$RUNNER_TEMP/shard-reports.txt"
          mapfile -t MISSING < "$RUNNER_TEMP/missing-shards.txt"
          SUCCESSFUL=${#REPORTS[@]}
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::warning title=Missing shard reports::${#MISSING[@]} of $SHARD_COUNT shards uploaded no mutation report: ${MISSING[*]}. Files that only they measured keep their previous dashboard data; a span-split file is published with the part another shard measured."
            {
              echo '### Missing shard reports';
              echo '';
              echo "> [!WARNING]";
              echo "> ${#MISSING[@]} of $SHARD_COUNT shards uploaded no mutation report: shard(s) ${MISSING[*]}. Check those jobs (lost runner, timeout or failure)."
              echo '';
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$SUCCESSFUL" -eq 0 ]; then
            echo "::error::No shard reports found. All $SHARD_COUNT shards failed to produce mutation-report.json."
            exit 1
          fi

          echo "Merging $SUCCESSFUL / $SHARD_COUNT shard reports:"
          printf '  - %s\n' "${REPORTS[@]}"

          # #1440: a report that tested mutants and killed none comes from a
          # runner that did not activate the mutants. Publishing it would
          # show 0 % for its files as if it were a measurement. Only the
          # default matrix is guarded (see the shard step of the same name).
          ZERO_KILLED=()
          for report in "${REPORTS[@]}"; do
            if [ "$SELECT_MODE" != "matrix" ]; then
              break
            fi
            TESTED=$(jq '[.files[] | (.mutants // [])[] | select(.status == "Killed" or .status == "Survived" or .status == "Timeout")] | length' "$report")
            KILLED=$(jq '[.files[] | (.mutants // [])[] | select(.status == "Killed")] | length' "$report")
            if [ "$TESTED" -gt 0 ] && [ "$KILLED" -eq 0 ]; then
              ZERO_KILLED+=("$report ($TESTED tested)")
            fi
          done
          if [ "${#ZERO_KILLED[@]}" -gt 0 ]; then
            echo "::error title=No mutant killed::Shard reports that tested mutants and killed none (the runner did not activate the mutants, #1440); nothing is published:"
            printf '  - %s\n' "${ZERO_KILLED[@]}"
            exit 1
          fi

          # Combine the shard reports file by file and mutant by mutant.
          # Metadata (thresholds, projectRoot, etc.) inherits from shard[0].
          # - Placeholders are dropped. A shard lists every file of the
          #   project, those outside its globs with an empty `mutants` array
          #   (#1681), and Stryker 5.0.0 lists the mutants of a file that
          #   fall outside the shard's text span (a span-split file, see
          #   SHARDS) with status Ignored and statusReason "Removed by
          #   mutate filter". Kept, they would overwrite the other shard's
          #   results, or publish a file that no shard measured; a file with
          #   placeholders only keeps its previous dashboard data.
          # - A file's remaining mutants are concatenated across shards, so
          #   the halves of a span-split file merge. When one half's shard
          #   uploaded nothing, the file is published with the half that ran
          #   (the missing shard is named in the warning above).
          # - The same mutant (location, mutator and replacement) held as a
          #   result by two shard reports means overlapping globs or a
          #   broken span pair: fail and name it instead of overwriting one.
          #   Should Stryker rename the placeholder reason, its placeholders
          #   count as results and this check fails loudly instead of
          #   merging them silently.
          JQ_DEFS='
            def placeholder: .status == "Ignored" and (.statusReason // "") == "Removed by mutate filter";
            def results: [(.mutants // [])[] | select(placeholder | not)];
            def mutant_key: [.location.start.line, .location.start.column, .location.end.line, .location.end.column, .mutatorName, .replacement] | tostring;
          '
          DUPLICATES=$(jq -s -r "$JQ_DEFS"'
            [to_entries[] | .key as $report | .value.files | to_entries[] | .key as $file
              | .value | results[] | {report: $report, file: $file, key: mutant_key}]
            | group_by([.file, .key])
            | map(select((map(.report) | unique | length) > 1) | "\(.[0].file) \(.[0].key)")
            | .[]' "${REPORTS[@]}")
          if [ -n "$DUPLICATES" ]; then
            echo "::error::Mutants held as results by more than one shard report (overlapping globs or a broken span pair):"
            echo "$DUPLICATES"
            exit 1
          fi

          jq -s "$JQ_DEFS"'
            (.[0]) + {files: (
              [.[] | .files | to_entries[] | .value.mutants = (.value | results) | select(.value.mutants | length > 0)]
              | group_by(.key)
              | map({key: .[0].key, value: (.[0].value + {mutants: (map(.value.mutants) | add)})})
              | from_entries)}' \
            "${REPORTS[@]}" > artifacts/mutation/reports/mutation-report.json

          # Guard: the merge must neither lose nor invent a result.
          EXPECTED=$(jq -s "$JQ_DEFS"'[.[] | .files[] | results | length] | add // 0' "${REPORTS[@]}")

          MUTANTS=$(jq '[.files | to_entries[] | .value.mutants // [] | length] | add // 0' \
            artifacts/mutation/reports/mutation-report.json)
          FILES=$(jq '.files | length' artifacts/mutation/reports/mutation-report.json)

          if [ "$MUTANTS" -ne "$EXPECTED" ]; then
            echo "::error::Merged report has $MUTANTS mutants but the $SUCCESSFUL shard reports hold $EXPECTED."
            exit 1
          fi

          {
            echo "successful=$SUCCESSFUL"
            echo "mutants=$MUTANTS"
            echo "files=$FILES"
          } >> "$GITHUB_OUTPUT"

          {
            echo '### Matrix Aggregation';
            echo '';
            echo "| Metric | Value |";
            echo "|--------|------:|";
            echo "| Shards attempted | $SHARD_COUNT |";
            echo "| Shards with reports | $SUCCESSFUL |";
            echo "| Shards missing a report | ${#MISSING[@]}${MISSING[*]:+ (${MISSING[*]})} |";
            echo "| Mutated files | $FILES |";
            echo "| Mutants | $MUTANTS |";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize aggregated results
        run: |
          output=$(dotnet run --file .github/scripts/update-mutation-summary.cs)
          echo "$output"
          {
            echo '';
            echo '### Mutation Summary (Aggregated)';
            echo '```';
            echo "$output";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregated mutation report
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: artifacts/mutation/reports
          if-no-files-found: error
