# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: es-ES

# Knowledge base configuration
knowledge_base:
  # Learn from project documentation
  learnings:
    scope: auto
  # Project context: AGENTS.md holds the rules (CLAUDE.md imports it and adds Claude Code specifics)
  opt_out: false

reviews:
  # High-level summary for each PR
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"

  # Request changes workflow: disabled. With it on, CodeRabbit submits a "changes requested"
  # review that GitHub does not dismiss when the bot itself resolves its threads, so under the
  # required-conversation-resolution rule on main it blocked auto-merge on #1093, #1098 and #1101
  # until the maintainer dismissed it by hand. Findings still arrive as threads and are still
  # answered and resolved one by one; only the blocking review state goes away.
  request_changes_workflow: false

  # Review status (show in PR comments)
  review_status: true

  # Collapse walkthrough details by default
  collapse_walkthrough: true

  # Sequence diagrams for complex logic
  sequence_diagrams: true

  # Poem in review (disabled - keep it professional)
  poem: false

  # Path-based instructions for reviewers
  path_instructions:
    - path: "src/**/*.cs"
      instructions: |
        - This is a .NET 10 library using C# 14 features
        - All code must have zero warnings (treat warnings as errors)
        - Check for proper nullable reference type annotations
        - Verify XML documentation on public APIs
        - Ensure Railway Oriented Programming pattern (Either<EncinaError, T>) is used correctly
        - No backward compatibility concerns - this is pre-1.0
        - All messaging patterns (Outbox, Inbox, Saga, Scheduling) must be opt-in
        - Cross-cutting integration: When reviewing new features, verify that the implementation
          considers Encina's 12 transversal functions (Caching, OpenTelemetry, Structured Logging,
          Health Checks, Validation, Resilience, Distributed Locks, Transactions, Idempotency,
          Multi-Tenancy, Module Isolation, Audit Trail). Flag if a new store or entity is missing
          TenantId/ModuleId, a new background service lacks distributed locking, a new external
          integration has no resilience, or a new provider has no OpenTelemetry instrumentation.

    - path: "src/Encina.DistributedLock*/**"
      instructions: |
        - Lock failure contract (ADR-052, docs/architecture/adr/052-distributed-lock-failure-contract.md):
          lock acquisition returns Either (TryAcquireAsync -> Either<EncinaError, Option<ILockHandle>>)
        - Contention or timeout is Right(None); infrastructure faults are Left with LockErrorCodes;
          OperationCanceledException propagates
        - Flag any new exception type for lock failures and any fault mapped to None or null

    - path: "src/Encina.Compliance.*/**"
      instructions: |
        - Aggregate rule violations (ADR-053, docs/architecture/adr/053-aggregate-rule-violations-return-either.md):
          aggregate command methods return Either<EncinaError, Unit> and factories return
          Either<EncinaError, TAggregate>
        - A rule violation is a Left with a rule code decided before RaiseEvent
        - Flag new `throw new InvalidOperationException` on rule paths in aggregates and any
          `catch (InvalidOperationException)` in compliance services
        - Argument guards (ThrowIf*) remain exceptions

    - path: "src/Encina.DomainModeling/**"
      instructions: |
        - Aggregate rule violations (ADR-053, docs/architecture/adr/053-aggregate-rule-violations-return-either.md):
          the IBusinessRule/Check support is the base for aggregate rule violations returning Either
        - The adapter from a rule violation to EncinaError must carry a rule code and never copy an
          exception message into EncinaError.Message

    - path: "tests/**/*.cs"
      instructions: |
        - Tests should follow AAA pattern (Arrange, Act, Assert)
        - Test names should be descriptive
        - Unit tests must be fast (<1ms per test)
        - Check for proper use of xUnit attributes
        - Verify test isolation (no shared state)

    - path: "**/*.md"
      instructions: |
        - Documentation must be in English
        - Check for broken links
        - Verify code examples compile

  # Tools configuration
  tools:
    # GitHub Checks integration
    github-checks:
      enabled: true
      timeout_ms: 120000

  # Auto-review settings
  auto_review:
    enabled: true
    # Only review when ready (not draft)
    drafts: false
    # Ignore generated files
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
    # Base branches to review
    base_branches:
      - main

  # Files to ignore
  path_filters:
    - "!docs/INVENTORY.md"

chat:
  # Enable chat in PR comments
  auto_reply: true

# Tone and style
tone_instructions: "Be direct and technical. Focus on .NET 10/C# 14 best practices. No praise, just clear issues with fixes. Pre-1.0: breaking changes OK."
